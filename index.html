ins('quickset',[
{id:'groups',phase:P1,title:'Settings classes, groups and file management',body:`
<h3>Settings classes</h3><p>SEL relays split settings into classes, each saved separately: <b>Global</b> (station ID, date format, PT/CT nominal, time source), <b>Group 1–6</b> (protection elements + group logic on the 351S), <b>Logic</b> (SELogic, on newer relays separate per group), <b>Port</b> (baud, protocol), <b>Report</b> (SER points, event length), <b>Front panel</b> (display points, LEDs, pushbuttons), <b>DNP/Modbus maps</b>.</p>
<h3>Settings groups</h3><p>Only one group is active. Switch with SELogic: <code>SS1 := IN103</code>, <code>SS2 := !IN103</code> (351S) or <code>SS1</code>…<code>SS6</code>. Bit <code>SG1</code>…<code>SG6</code> shows the active group. Uses: alternate source, maintenance/"hot line" fast-trip, cold-load, seasonal. Group change has a short delay (<code>TGR</code>) and resets elements: never switch during a fault.</p>
<h3>Working with QuickSet like a pro</h3><ul><li><b>Read</b> from the relay first, always. Save as-found with date and relay serial in the name.</li><li>Use the <b>part number</b> and <b>firmware (FID)</b> that match the relay. Wrong FID = settings that won't send.</li><li><b>Compare</b> (Tools → Compare) the as-found to the issued settings before you send. Every difference must be expected.</li><li>Send one class at a time and read back; the relay disables briefly while it saves (<code>EN</code> LED goes out).</li><li>Keep an <b>as-left</b> file and a printout signed off with the test sheet.</li></ul>
<h3>Passwords and access</h3><p>Level 0 (none), 1 (ACC: view), B (BAC: breaker control), 2 (2AC: settings), C (calibration, never use). Change factory passwords: OTTER / TAIL are defaults on many units. Monitor <code>SALARM</code> for access attempts and settings changes.</p>`,labs:[],
quiz:[{q:'Which bit tells you group 2 is active?',o:['SS2','SG2','G2','TGR'],a:1,why:'SSn selects, SGn shows the active group.'},
{q:'Before sending new settings you should:',o:['Send immediately','Read, save as-found, compare','Reboot','Change FID'],a:1,why:'As-found is your record and rollback.'},
{q:'Access level that lets you change settings:',o:['ACC','BAC','2AC','QUI'],a:2,why:'Level 2.'}]}]);
ins('ann',[
{id:'hmi',phase:P4,title:'Front panel: pushbuttons, LEDs and display points',body:`
<h3>Target LEDs</h3><p>Programmable LEDs show what operated. Set each with SELogic, e.g. <code>T1_LED := 51P1T</code>, and choose latching (cleared with TARGET RESET) or following. Standard: TRIP latched, phase/ground/zone LEDs latched, 79LO and alarm following. Label them on the slide-in card.</p>
<h3>Operator pushbuttons</h3><p>The 751/787/351S-with-pushbuttons have PB1…PB8 with LEDs. Pattern for a toggle (e.g. ground trip enable):</p><pre>SET1 := R_TRIG PB01 * !LT01
RST1 := R_TRIG PB01 * LT01
PB1_LED := LT01</pre><p>Latch bits survive power loss (stored in nonvolatile memory), so the selection stays after a restart.</p>
<h3>Breaker control from the panel</h3><p>Use two buttons and require both (SELECT then OPERATE) or a timed arming bit: <code>SV05 := R_TRIG PB03</code> with <code>SV05PU=0, SV05DO=300</code> (5 s window), then <code>CL := SV05T * R_TRIG PB04 * !LT01</code>. Prevents a bumped button from closing a breaker.</p>
<h3>Display points</h3><p>Rotating screen text: name, a bit or analog, and two strings, e.g. <code>DP1 := 52A</code> with <code>DP1_1 = BREAKER CLOSED</code>, <code>DP1_0 = BREAKER OPEN</code>. Analog display shows MW, MVAR, amps. Keep the most operational info first.</p>
<h3>Local / remote</h3><p>Use a latch for LOCAL mode. In LOCAL, block SCADA control (<code>!LT02</code> in the remote close/trip equation); in REMOTE, block panel close. Annunciate the mode.</p>`,labs:[],
quiz:[{q:'Why use latch bits for pushbutton modes?',o:['Faster','Survive power cycles','Required by DNP','Lower CPU'],a:1,why:'Latches are nonvolatile.'},
{q:'What stops a bumped button closing a breaker?',o:['Latching LED','Select-before-operate window','Display point','Password level 1'],a:1,why:'Requires two deliberate actions inside a time window.'},
{q:'TRIP LED should usually be:',o:['Following','Latched until target reset','Off','Flashing'],a:1,why:'So the operator sees what happened after the fault clears.'}]},
{id:'comms',phase:P4,title:'SCADA: DNP3, Modbus and IEC 61850 GOOSE',body:`
<h3>DNP3</h3><p>The utility standard. The relay is an outstation; the RTU or SCADA master polls it. You build a <b>map</b>: binary inputs (bits like <code>52A</code>, <code>TRIP</code>, <code>79LO</code>), analog inputs (IA, MW with scale and deadband), binary outputs (remote bits <code>RB01</code> for trip/close). Key settings: DNP address, master address, event class per point, deadbands, unsolicited reporting on/off.</p>
<h3>Controls through remote bits</h3><p>SCADA never drives outputs directly. It pulses <code>RB01</code>; your logic decides: <code>TR := … + RB01 * !LT02</code> (remote trip, not in local). Use separate bits for trip and close and pulse (not latch) them.</p>
<h3>Modbus</h3><p>Common in industrial plants (751, 787 on motor/MCC). Registers instead of points; check word order and scaling. Read-only polling for metering, coils for control.</p>
<h3>IEC 61850 GOOSE</h3><p>Fast peer-to-peer Ethernet messages between relays (~4 ms). Used for breaker-failure initiate, bus blocking schemes, interlocks, replacing hard wiring. Configured in Architect: publish a dataset, subscribe the other relay, map received bits to virtual bits (<code>VB001</code>). Always monitor message quality (<code>VBxxx</code> + link health bits) and decide what the logic does if GOOSE is lost: fail safe.</p>
<h3>Point list discipline</h3><p>Every point on the SCADA list must be tested end to end: force it at the relay (or create the real condition) and confirm the master shows the right name and state. Wrong point index is the most common commissioning error.</p>
<h3>Time sync</h3><p>IRIG-B from a GPS clock (or PTP / SNTP). Without it, event reports from two ends of a line can't be aligned. Check <code>TSOK</code> / the time-source bit.</p>`,labs:[],
quiz:[{q:'How does SCADA trip a breaker through an SEL relay?',o:['Writes OUT101 directly','Pulses a remote bit used in TR','Changes a setting','Sends GOOSE to itself'],a:1,why:'Logic decides; remote bits are just inputs.'},
{q:'Most common SCADA commissioning error?',o:['Baud rate','Wrong point index/mapping','Relay firmware','CT ratio'],a:1,why:'Point-by-point end-to-end test catches it.'},
{q:'GOOSE subscription lost. Logic should:',o:['Ignore it','Fail to a safe state and alarm','Trip everything','Reboot'],a:1,why:'Design for message loss.'}]},
{id:'sync',phase:P4,title:'Sync-check (25) and breaker failure (50BF)',body:`
<h3>Sync-check</h3><p>Before closing two live systems together, voltages must match. 25 compares bus and line voltage: magnitude window (<code>25VLO</code>/<code>25VHI</code>), slip frequency (<code>25SF</code>, e.g. 0.05 Hz), angle (<code>25ANG1</code>, e.g. 20–30°). Bit <code>25A1</code> = ok to close. Use it in <code>79CLS</code> and the manual close equation.</p>
<h3>Dead-line / dead-bus closing</h3><p>If one side is dead, sync-check can't pass. Add explicit permissions: <code>CL := … * (25A1 + 27S * 59P1)</code> = dead line, live bus. Decide which ends may close dead-line — usually only one.</p>
<h3>Breaker failure (50BF)</h3><p>If the breaker doesn't open after a trip, the upstream breakers must. Logic: trip issued (BFI) AND current still above a low pickup (<code>50BF</code>, ~0.5–1 A sec) for the BF timer (~8–10 cycles) → trip the bus lockout. Re-trip the own breaker first (second trip coil). In SELogic on a 351S using a SV timer:</p><pre>SV06 := TRIP * 50P2      (BFI and current present)
SV06PU = 9 cyc
OUT103 := SV06T          (to 86BF bus lockout)</pre>
<h3>Why current, not 52A?</h3><p>The 52a contact can show open while an arc still flows. Current is the truth. For low-current trips (transformer gas relay) add 52A as an alternative.</p>`,labs:[],
quiz:[{q:'Which setting limits closing across a frequency difference?',o:['25ANG1','25SF slip frequency','25VLO','79OI1'],a:1,why:'Slip frequency.'},
{q:'Breaker failure is detected mainly by:',o:['52A','Current still flowing after trip + timer','Voltage','Frequency'],a:1,why:'Current proves the arc is still there.'},
{q:'Typical BF timer:',o:['1 cycle','8–10 cycles','2 s','30 s'],a:1,why:'Breaker time plus margin.'}]}]);
ins('verify',[
{id:'safety',phase:P5,title:'Test switches, safety and as-left documentation',body:`
<h3>Before you touch anything</h3><ul><li>Switching order and permit from the system operator. Know which breaker trips if you make a mistake.</li><li>Isolate <b>trip outputs first</b> (open trip-circuit test switch paddles), then voltage, then current. Restore in reverse: currents, voltages, check no targets/pickups, trip last.</li><li>Lock out / tag out per site procedure. Verify absence of voltage with a tested meter.</li></ul>
<h3>FT-1 test switch</h3><p>Current paddles have a <b>shorting</b> feature: opening the paddle shorts the CT before breaking the relay circuit. <b>Never open-circuit a CT</b> — thousands of volts appear on the secondary. Insert the test plug only into a short-circuited current pole, and confirm with a clamp meter that current is now in the shorting path.</p>
<h3>Interlocks you defeat on purpose</h3><p>Breaker failure initiate, bus lockouts, transfer trip, GOOSE to other relays. Disable or isolate each, write it on a "defeated" list, and restore + verify every item before you leave.</p>
<h3>Test sheet contents</h3><ul><li>Relay ID, serial, FID, settings file name and checksum.</li><li>Each element: setting, expected, measured pickup/time, pass/fail and tolerance (pickup ±5%, time ±1.5 cycle or ±5%).</li><li>Logic checks: each output verified to the device it trips.</li><li>Inputs: each one forced in the field (not jumpered at the relay).</li><li>In-service checks: metering, phase rotation, directional/differential quantities under load.</li><li>As-left: targets reset, SER/event cleared, test switches closed, alarms clear, time synced, sign and date.</li></ul>`,labs:[],
quiz:[{q:'Isolation order before testing:',o:['Currents, voltages, trips','Trips first, then voltages, then currents','Any order','Voltages first'],a:1,why:'Prevents an accidental trip while you work.'},
{q:'Opening a CT secondary while loaded causes:',o:['Nothing','Dangerous high voltage','Relay trip only','Reduced metering'],a:1,why:'The CT tries to push current into an open circuit.'},
{q:'Typical pickup tolerance:',o:['±0.1%','±5%','±25%','None'],a:1,why:'Check the manual for each element.'}]}]);
})();
(function(){var P='Start here · Absolute basics';
window.LESSONS.unshift(
{id:'b1',phase:P,title:'Electricity in one picture',body:`
<p>Think of a garden hose.</p>
<ul><li><b>Voltage (V)</b> is the water pressure. It pushes.</li><li><b>Current (I, amps)</b> is how much water flows.</li><li><b>Resistance (R, ohms)</b> is how narrow the hose is. It holds the flow back.</li></ul>
<p>More push = more flow. Narrower hose = less flow. That is the whole of <b>Ohm's law</b>: I = V ÷ R.</p>
<h3>Try it</h3><p>120 volts across a 60 ohm heater: 120 ÷ 60 = <b>2 amps</b>.</p>
<p>That's all for this screen. You'll use this one rule more than any other.</p>`,labs:[],
quiz:[{q:'Voltage is like…',o:['The amount of water','The water pressure','The hose width','The tap'],a:1,why:'Voltage pushes.'},
{q:'240 V across 60 Ω. Current?',o:['2 A','4 A','14,400 A','0.25 A'],a:1,why:'240 ÷ 60 = 4.'},
{q:'Resistance goes up, voltage stays the same. Current…',o:['Goes up','Goes down','Stays the same','Reverses'],a:1,why:'Narrower hose, less flow.'}]},
{id:'b2',phase:P,title:'What a fault is',body:`
<p>Normally, current goes out on a wire, through the <b>load</b> (motors, lights, houses) and back. The load is the "narrow hose" that limits the current.</p>
<p>A <b>fault</b> is when current finds a shortcut that skips the load: a tree touching a line, a wire touching the ground, two wires touching each other.</p>
<h3>Why it's dangerous</h3><p>No load = almost no resistance. Remember I = V ÷ R: tiny R means <b>huge</b> current. Thousands of amps. Wires melt, equipment explodes, people get hurt.</p>
<h3>The three kinds you'll hear about</h3><ul><li><b>Ground fault</b>: one wire to earth. The most common.</li><li><b>Phase-to-phase</b>: two wires touch.</li><li><b>Three-phase</b>: all three touch. Rare but the biggest current.</li></ul>
<p>The whole job of protection: notice the huge current fast and switch it off.</p>`,labs:[],
quiz:[{q:'A fault is…',o:['Too much load','Current taking a shortcut that skips the load','A broken relay','Low voltage'],a:1,why:'It bypasses what normally limits current.'},
{q:'Why is fault current so big?',o:['Voltage rises','Resistance is tiny','The CT amplifies it','The relay adds it'],a:1,why:'I = V ÷ small R.'},
{q:'Most common fault type?',o:['Three-phase','Ground fault','Phase-to-phase','None'],a:1,why:'One wire to earth.'}]},
{id:'b3',phase:P,title:'Breaker = muscle, relay = brain',body:`
<p>Two separate pieces of equipment do the protecting.</p>
<ul><li><b>The breaker</b> is a big switch. It can open while thousands of amps flow. But it has no brain: it only opens when told to.</li><li><b>The relay</b> (the SEL box) is the brain. It watches the current and voltage and decides "that's a fault". Then it sends a signal to the breaker: <b>trip</b> (open).</li></ul>
<h3>How the relay tells the breaker</h3><p>The relay closes a small contact inside it (an <b>output</b>, like OUT101). That lets battery power (usually 125 V DC) flow into the breaker's <b>trip coil</b>, an electromagnet that releases a spring and snaps the breaker open.</p>
<h3>How the relay knows it worked</h3><p>The breaker has little switches that follow its position, called <b>52a</b> (closed when the breaker is closed) and <b>52b</b> (the opposite). They are wired back to the relay's <b>inputs</b>.</p>
<p>So: relay <b>outputs</b> = commands out. Relay <b>inputs</b> = information in.</p>`,labs:[],
quiz:[{q:'Which one decides there is a fault?',o:['Breaker','Relay','Trip coil','52a'],a:1,why:'Relay = brain.'},
{q:'The relay trips the breaker by…',o:['Cutting the main wire itself','Closing an output contact that energizes the trip coil','Sending Wi-Fi','Raising voltage'],a:1,why:'Small contact, battery power, trip coil.'},
{q:'52a tells the relay…',o:['Current','Breaker position','Voltage','Frequency'],a:1,why:'It follows the breaker open/closed.'}]},
{id:'b4',phase:P,title:'CTs and PTs: shrinking big to small',body:`
<p>The power line might carry 1,000 amps at 13,800 volts. You can't run that into a small relay box.</p>
<ul><li>A <b>CT</b> (current transformer) shrinks current. A <b>600:5</b> CT turns 600 A on the line into 5 A for the relay.</li><li>A <b>PT</b> (potential/voltage transformer) shrinks voltage, usually down to about 120 V.</li></ul>
<h3>The ratio</h3><p>600:5 = 600 ÷ 5 = <b>120</b>. That number is the setting <code>CTR</code>. Line amps = relay amps × 120.</p>
<h3>Try it</h3><p>Relay sees 2 A with CTR 120. Line current = 2 × 120 = <b>240 A</b>.</p>
<p>Relay settings are almost always in these small "secondary" amps. Converting back and forth is something you'll do every day.</p>
<p><b>Safety, learn this now:</b> never open (disconnect) a CT wire while current is flowing. It makes thousands of volts. You short it first.</p>`,labs:[],
quiz:[{q:'800:5 CT. CTR?',o:['800','160','5','4000'],a:1,why:'800 ÷ 5 = 160.'},
{q:'Relay shows 3 A, CTR 120. Line amps?',o:['40','360','123','3'],a:1,why:'3 × 120.'},
{q:'Never do this to a live CT:',o:['Short it','Open its circuit','Measure it','Label it'],a:1,why:'Open CT = dangerous high voltage.'}]},
{id:'b5',phase:P,title:'AC, three phases and 60 Hz',body:`
<p>Power in North America is <b>AC</b>: the current swings forward and back 60 times a second. That's <b>60 Hz</b>.</p>
<p>There are <b>three wires</b> (phases A, B, C). Each one swings the same way, but a third of a turn later than the one before: 120° apart. Picture three people on a bike pedal, evenly spaced.</p>
<h3>Why you care</h3><ul><li>Healthy system: three equal currents, evenly spaced 120°. "Balanced".</li><li>Fault or wiring mistake: one is bigger, or in the wrong place. "Unbalanced".</li></ul>
<p>The relay shows each current as a size and an angle, e.g. <code>IA 2.1 A ∠ -25°</code>. Checking that the three angles are 120° apart is one of the first things you do on a new install.</p>`,labs:[],
quiz:[{q:'60 Hz means…',o:['60 volts','Swings 60 times a second','60 amps','60 wires'],a:1,why:'Cycles per second.'},
{q:'Healthy phases are spaced…',o:['90°','120°','180°','0°'],a:1,why:'360 ÷ 3.'},
{q:'IA at 0°, IB at 0°, IC at 240°. Problem?',o:['None','B is in the wrong place','Frequency','Voltage'],a:1,why:'B should be at 240° (−120°) and C at 120°.'}]},
{id:'b6',phase:P,title:'On/off logic: AND, OR, NOT',body:`
<p>Inside the relay everything is either <b>1 (true / on)</b> or <b>0 (false / off)</b>. These are called <b>bits</b>. Example: bit <code>52A</code> is 1 when the breaker is closed.</p>
<p>You combine bits with three words:</p>
<ul><li><b>AND</b>: both must be 1. "Trip if fault AND breaker closed."</li><li><b>OR</b>: either one is enough. "Trip if fast element OR slow element."</li><li><b>NOT</b>: flips it. NOT 1 = 0.</li></ul>
<h3>Try it</h3><p>A = 1, B = 0.<br>A AND B = <b>0</b>. A OR B = <b>1</b>. NOT B = <b>1</b>.</p>
<p>SEL writes them as symbols too: <code>*</code> = AND, <code>+</code> = OR, <code>!</code> = NOT. So <code>51P1T + 50P1</code> means "slow element OR fast element". That's a real trip equation.</p>`,labs:[],
quiz:[{q:'1 AND 0 =',o:['1','0'],a:1,why:'AND needs both.'},
{q:'1 OR 0 =',o:['1','0'],a:0,why:'OR needs one.'},
{q:'In SEL, + means',o:['AND','OR','NOT','Plus one'],a:1,why:'+ is OR, * is AND, ! is NOT.'}]},
{id:'b7',phase:P,title:'Element numbers (the device codes)',body:`
<p>Protection functions have standard numbers. You only need a few to start:</p>
<ul><li><b>50</b>: instant overcurrent. Trips immediately above a level. For big, close faults.</li><li><b>51</b>: time overcurrent. The more current, the faster it trips. For smaller or far-away faults, and gives other breakers a chance first.</li><li><b>52</b>: the breaker itself (that's why it's 52a/52b).</li><li><b>27 / 59</b>: under / over voltage.</li><li><b>81</b>: frequency.</li><li><b>87</b>: differential: current in ≠ current out means a fault inside.</li></ul>
<h3>Letters after the number</h3><p><b>P</b> = phase, <b>G</b> = ground. So <code>51P1</code> = phase time overcurrent, number 1. A <b>T</b> on the end (<code>51P1T</code>) means it has <b>timed out</b>: ready to trip.</p>
<p>Next: the course map, then the real material. Everything from here builds on these seven screens.</p>`,labs:[],
quiz:[{q:'Instant overcurrent is',o:['51','50','52','87'],a:1,why:'50 = instant.'},
{q:'51P1T means',o:['Ground element picked up','Phase time overcurrent has timed out','Breaker closed','Test mode'],a:1,why:'P = phase, T = timed out.'},
{q:'87 compares…',o:['Voltage to frequency','Current in vs current out','Time','Temperature'],a:1,why:'Differential.'}]});

{id:'b8',phase:P,title:'Power: watts, VA, and power factor',body:`
<p>Current and voltage together do work. That work rate is <b>power</b>.</p>
<h3>Simple power</h3><p>For DC or a pure heater: <b>P = V × I</b>. 120 V × 10 A = 1,200 W = 1.2 kW.</p>
<h3>Why AC adds a wrinkle</h3><p>Motors and transformers need some current just to build their magnetic field. That current flows back and forth but does no useful work. So AC power has three parts:</p>
<ul><li><b>Real power (P, watts, W)</b>: does the work. Turns the shaft, heats the heater.</li><li><b>Reactive power (Q, vars)</b>: builds magnetic fields. Needed, but does no work.</li><li><b>Apparent power (S, volt-amps, VA)</b>: what the wires actually carry. S = V × I.</li></ul>
<p>They form a right triangle: S² = P² + Q².</p>
<h3>Power factor</h3><p><b>PF = P ÷ S</b>. A PF of 0.9 means 90% of the current is doing useful work. Low PF = more current for the same work = hotter wires.</p>
<h3>Three-phase</h3><p>For three phases: S = √3 × V<sub>line-to-line</sub> × I. Example: 13.8 kV, 400 A → 1.732 × 13,800 × 400 ≈ 9.56 MVA.</p>
<h3>Why a relay engineer cares</h3><ul><li>Relays meter MW, MVAR and PF. You check them against SCADA to prove the wiring is right.</li><li>The sign of MW tells you which way power flows. If a feeder shows power flowing <i>into</i> the bus, your CTs may be backwards.</li><li>Equipment ratings (transformers in MVA) tell you the maximum load current, which tells you how high to set pickups.</li></ul>`,labs:[],
quiz:[{q:'120 V heater draws 5 A. Power?',o:['24 W','600 W','125 W','6 kW'],a:1,why:'120 × 5.'},
{q:'Power factor =',o:['Q ÷ P','P ÷ S','S ÷ P','V ÷ I'],a:1,why:'Real over apparent.'},
{q:'A feeder meters power flowing into the bus when it should feed load. Suspect:',o:['Low PF','Reversed CTs','High voltage','Frequency'],a:1,why:'CT polarity flips the power sign.'}]},
{id:'b9',phase:P,title:'Series and parallel circuits',body:`
<h3>Series: one path</h3><p>Things connected end to end. Same current through each. Resistances add: R = R1 + R2. If one breaks, everything stops.</p>
<p><b>Relay example</b>: trip contacts from two relays in <i>series</i> means BOTH must close to trip. That's AND logic made of wire.</p>
<h3>Parallel: many paths</h3><p>Things connected side by side across the same two points. Same voltage across each. Current splits. If one path breaks, the others still work.</p>
<p><b>Relay example</b>: trip contacts from the main relay and the backup relay in <i>parallel</i>: EITHER one trips the breaker. That's OR logic made of wire. This is how almost every trip circuit is built.</p>
<h3>CT circuits are series</h3><p>The CT secondary runs in a loop through every device that needs that current: relay, then meter, then back. Same current through each. Open the loop anywhere and the whole loop is open. That's why one loose wire is dangerous.</p>
<h3>PT circuits are parallel</h3><p>Voltage goes to many devices side by side. Removing one device doesn't affect the others.</p>
<h3>Quick check</h3><p>Two 60 Ω resistors in series = 120 Ω. In parallel = 30 Ω (half, for two equal ones).</p>`,labs:[],
quiz:[{q:'Two relay trip contacts in parallel means trip if…',o:['Both close','Either closes','Neither','They alternate'],a:1,why:'Parallel = OR.'},
{q:'CT secondary devices are connected in…',o:['Parallel','Series','Neither','Delta only'],a:1,why:'Same current through each.'},
{q:'Two 100 Ω resistors in parallel:',o:['200 Ω','50 Ω','100 Ω','0 Ω'],a:1,why:'Equal pair in parallel = half.'}]},
{id:'b10',phase:P,title:'DC control power: the battery runs everything',body:`
<p>Here's a surprise for beginners: substation protection does <b>not</b> run on the power line it protects. It runs on a big <b>battery bank</b>, usually <b>125 V DC</b> (sometimes 48 V or 250 V).</p>
<h3>Why a battery?</h3><p>During a fault the AC voltage can collapse to nearly zero. If the relay ran on AC, it would die exactly when it's needed. The battery keeps relays alive and keeps enough energy to trip breakers.</p>
<h3>The DC system</h3><ul><li><b>Charger</b>: keeps the battery topped up from station AC.</li><li><b>Battery</b>: lead-acid or NiCd cells in series.</li><li><b>DC panel</b>: fuses or breakers feeding each relay panel and each breaker's trip and close circuits.</li></ul>
<h3>Positive and negative, and grounds</h3><p>The DC system is normally <b>ungrounded</b>: neither + nor − is tied to earth. A <b>DC ground detector</b> watches for either side leaking to earth. One ground does nothing. A second ground on the other side can trip a breaker on its own, so you chase DC grounds quickly.</p>
<h3>What it powers on a relay panel</h3><ul><li>The relay's own power supply.</li><li>The trip coil circuit, through the relay output contact.</li><li>The close coil circuit.</li><li>The <b>wetting voltage</b> for contact inputs: 52a, 52b, alarms. The relay input sees 125 V when the contact is closed.</li></ul>
<p>A relay's input voltage rating must match: a 48 V input on a 125 V system will burn up; a 125 V input on 48 V won't pick up.</p>`,labs:[],
quiz:[{q:'Why do relays run on a battery?',o:['Cheaper','AC can collapse during the fault','Required by SEL','Less noise'],a:1,why:'Protection must work when AC is gone.'},
{q:'Typical substation DC voltage:',o:['12 V','125 V','480 V','13.8 kV'],a:1,why:'125 V DC is most common.'},
{q:'Why chase a single DC ground fast?',o:['It trips immediately','A second ground can cause a false trip','It drains the battery instantly','It breaks the relay'],a:1,why:'Two grounds create an unintended path.'}]},
{id:'b11',phase:P,title:'Reading drawings: one-line, three-line, DC schematic',body:`
<p>Every job starts with drawings. There are three kinds you must read.</p>
<h3>One-line diagram</h3><p>The whole station drawn as if it had one wire. Shows breakers (squares), transformers (two circles), buses (thick lines), CTs (small circles on lines), PTs, and which relay protects what (circle with a device number like 51 or 87). Use it to answer: <i>what does this relay protect, and which breakers does it trip?</i></p>
<h3>Three-line (AC schematic)</h3><p>Every phase drawn separately: CT and PT wiring from the yard to each relay terminal. Shows CT ratios, polarity dots, test switches, and grounding points. Use it to answer: <i>which relay terminal gets IA, and is the CT polarity right?</i></p>
<h3>DC elementary (control schematic)</h3><p>Drawn like a ladder: + bus down the left, − bus down the right. Each rung is a circuit: fuse → contacts → coil. Shows trip, close, alarm, and input circuits. Use it to answer: <i>what has to close to trip this breaker?</i></p>
<h3>Wiring diagrams</h3><p>Physical: which wire goes from which terminal block point to which relay terminal. Use it in the field to find a wire.</p>
<h3>Polarity dots</h3><p>A dot on a CT or PT marks its polarity end. Current entering the primary dot leaves the secondary dot. Get this wrong and directional, differential and power metering all go wrong.</p>
<h3>Habits</h3><ul><li>Always work from the latest revision. Check the revision block.</li><li>Redline every change you make in the field and turn it in.</li><li>Trace one circuit fully with a highlighter before you touch it.</li></ul>`,labs:[],
quiz:[{q:'Which drawing shows what must close to trip a breaker?',o:['One-line','DC elementary','Plot plan','Nameplate'],a:1,why:'Control circuits are on the DC schematic.'},
{q:'Polarity dots matter most for…',o:['Fuses','Directional and differential elements','Lights','Batteries'],a:1,why:'Both depend on current direction.'},
{q:'You change a wire in the field. Afterwards:',o:['Nothing','Redline the drawing','Delete the drawing','Change the relay FID'],a:1,why:'Drawings must match the field.'}]},
{id:'b12',phase:P,title:'Transformers, briefly',body:`
<p>A power transformer changes voltage. Two coils on an iron core: voltage goes down by the turns ratio, current goes up by the same ratio. Power in ≈ power out.</p>
<h3>Example</h3><p>A 115 kV / 13.8 kV, 20 MVA transformer. Full-load current on the high side: 20,000,000 ÷ (1.732 × 115,000) ≈ <b>100 A</b>. On the low side: 20,000,000 ÷ (1.732 × 13,800) ≈ <b>837 A</b>. Same power, very different currents.</p>
<h3>Delta and wye</h3><ul><li><b>Wye (Y, star)</b>: three coils joined at a neutral point. The neutral can be grounded.</li><li><b>Delta (Δ)</b>: three coils in a triangle, no neutral.</li></ul>
<p>A delta-wye transformer shifts the phase angle by 30° between sides. That's why a differential relay (787) needs settings that correct the angle: otherwise it sees a mismatch that isn't a fault.</p>
<h3>Inrush</h3><p>When you first energize a transformer, it can draw 6–12× full-load current for a few cycles while the core magnetizes. To a relay, that looks like a fault. Differential relays recognize it by its <b>2nd harmonic</b> content and block.</p>
<h3>What protects a transformer</h3><ul><li><b>87T</b> differential: internal faults.</li><li><b>50/51</b> overcurrent: backup.</li><li><b>Sudden pressure / gas relays</b>: internal arcing.</li><li><b>Temperature</b>: overloads.</li></ul>`,labs:[],
quiz:[{q:'20 MVA, 13.8 kV side full-load current about:',o:['100 A','837 A','1,449 A','20 A'],a:1,why:'20e6 ÷ (1.732 × 13,800).'},
{q:'Delta-wye shifts phase angle by',o:['0°','30°','90°','180°'],a:1,why:'Standard 30° shift.'},
{q:'Inrush is recognized by',o:['5th harmonic','2nd harmonic','Low voltage','Frequency'],a:1,why:'Inrush is rich in 2nd harmonic.'}]},
{id:'b13',phase:P,title:'Grounding: how the system ties to earth',body:`
<p>How a power system connects to earth decides how big ground-fault current is, and which relays can see it.</p>
<ul><li><b>Solidly grounded</b>: neutral tied straight to earth. Ground faults are large, like phase faults. Easy to detect with residual 51G. Most utility distribution.</li><li><b>Low-resistance grounded</b>: a resistor limits ground fault to e.g. 400 A. Less damage; still easy to detect. Common in industrial plants.</li><li><b>High-resistance grounded</b>: limited to a few amps. The plant can keep running with one ground fault; it just alarms. Needs sensitive detection (core-balance CT or 59N voltage).</li><li><b>Ungrounded</b>: no intentional connection. First ground fault barely flows current; it shows up as voltage shift. Second fault on another phase = a big phase-to-phase fault.</li></ul>
<h3>Why it matters for settings</h3><p>Set your ground pickup below the smallest ground fault you need to catch. On a 400 A resistance-grounded system, a 51G set at 600 A will <b>never</b> trip. This mistake happens in real life.</p>
<h3>Safety grounding is different</h3><p>Equipment grounding (bonding enclosures to the ground grid) protects people from touch voltage. It's separate from system grounding, but you'll hear "ground" for both.</p>`,labs:[],
quiz:[{q:'400 A resistance-grounded system, 51G set at 600 A primary. Result?',o:['Fine','Never trips for a ground fault','Trips on load','Too fast'],a:1,why:'Fault current can\'t exceed 400 A.'},
{q:'High-resistance grounding lets a plant…',o:['Ignore ground','Keep running with one ground fault and alarm','Trip faster','Skip CTs'],a:1,why:'Fault current is tiny.'},
{q:'Ungrounded first ground fault shows mainly as',o:['Huge current','Voltage shift','Frequency drop','Nothing ever'],a:1,why:'Little current flows.'}]}]);

{id:'pt1',phase:P,title:'Zones of protection and overlap',body:`
<p>The system is cut into <b>zones</b>: a line, a bus, a transformer, a motor. Each zone has its own relay, and each zone is bounded by breakers that can isolate it.</p>
<h3>Rules every design follows</h3><ul><li><b>Every piece of equipment is inside at least one zone.</b> No blind spots.</li><li><b>Zones overlap at the breakers.</b> The CTs for the bus relay are on the line side of the breaker, and the CTs for the line relay are on the bus side. So a fault <i>inside</i> the breaker is seen by both.</li><li><b>Smallest zone trips first.</b> Only the breakers needed to clear the fault should open.</li></ul>
<h3>Primary and backup</h3><ul><li><b>Primary</b>: the fast relay for its own zone (e.g. 87 bus differential).</li><li><b>Local backup</b>: a second relay or element at the same station, used if the primary fails (e.g. 51 overcurrent, or breaker failure).</li><li><b>Remote backup</b>: a relay at the next station that sees through the zone, slowly (e.g. Zone 2/3 distance, upstream 51).</li></ul>
<h3>The four qualities</h3><ul><li><b>Dependability</b>: trips when it should.</li><li><b>Security</b>: doesn't trip when it shouldn't.</li><li><b>Speed</b>: clears before damage or instability.</li><li><b>Selectivity</b>: trips only what's necessary.</li></ul><p>These fight each other. More sensitivity raises dependability but hurts security. Every setting is a compromise you should be able to explain.</p>`,labs:[],
quiz:[{q:'Zones overlap at…',o:['Loads','Breakers','PTs','Batteries'],a:1,why:'So no fault point is missed.'},
{q:'Upstream 51 clearing a fault after the feeder relay failed is…',o:['Primary','Remote backup','Security','Inrush'],a:1,why:'It sees through the downstream zone, slowly.'},
{q:'Relay trips on a fault outside its zone. Which quality failed?',o:['Dependability','Security','Speed','Sensitivity'],a:1,why:'Security = not tripping when it shouldn\'t.'}]},
{id:'pt2',phase:P,title:'Fault current math: the MVA method',body:`
<p>You must estimate fault current to set pickups. Real studies use software (ASPEN, CAPE, SKM), but you should be able to sanity-check them by hand.</p>
<h3>Source strength</h3><p>The utility gives the <b>available fault MVA</b> at the point of supply, e.g. 500 MVA at 13.8 kV.</p>
<h3>Three-phase fault current</h3><p>I<sub>fault</sub> = MVA ÷ (√3 × kV). 500 ÷ (1.732 × 13.8) = <b>20.9 kA</b>.</p>
<h3>Through a transformer</h3><p>A transformer limits fault current by its impedance (Z%). Fault MVA through a transformer alone = MVA<sub>rating</sub> ÷ Z. A 10 MVA, 8% transformer: 10 ÷ 0.08 = 125 MVA.</p>
<h3>Combining in series</h3><p>Series elements combine like parallel resistors: 1/MVA<sub>total</sub> = 1/MVA<sub>1</sub> + 1/MVA<sub>2</sub>.</p><p>Source 500 MVA + transformer 125 MVA: 1/(1/500 + 1/125) = <b>100 MVA</b>. At 13.8 kV that's 100 ÷ (1.732 × 13.8) = 4.18 kA.</p>
<h3>Other fault types (rules of thumb)</h3><ul><li>Phase-to-phase ≈ 0.866 × three-phase (√3/2).</li><li>Ground fault on solid grounding: roughly similar to three-phase near a wye-grounded transformer; much less with resistance grounding.</li></ul>
<h3>Why both max and min matter</h3><ul><li><b>Maximum</b> fault: equipment ratings, CT saturation, 50 element reach.</li><li><b>Minimum</b> fault (end of line, weak source, phase-phase or high-resistance ground): your 51 pickup must be below this, with margin (often half).</li></ul>`,labs:[],
quiz:[{q:'250 MVA at 13.8 kV. Three-phase fault current?',o:['18.1 kA','10.5 kA','3.4 kA','250 kA'],a:1,why:'250 ÷ (1.732×13.8) ≈ 10.5.'},
{q:'20 MVA transformer, Z = 10%. Its fault MVA limit:',o:['2','200','20','2000'],a:1,why:'20 ÷ 0.10.'},

{id:'pt3',phase:P,title:'Symmetrical components without the math',body:`
<p>Unbalanced currents are hard to reason about. Fortescue showed any three unbalanced phasors can be split into three balanced sets. Relays do this internally every cycle.</p>
<ul><li><b>Positive sequence (I1)</b>: normal rotation A-B-C. Balanced load is almost pure I1.</li><li><b>Negative sequence (I2)</b>: reverse rotation A-C-B. Appears with unbalance: phase-to-phase faults, open phases, unbalanced load. Heats motor rotors.</li><li><b>Zero sequence (I0)</b>: all three in step. Only flows when there's a ground path. 3I0 = IA + IB + IC = the residual current.</li></ul>
<h3>Which faults produce what</h3><table><tr><th>Fault</th><th>I1</th><th>I2</th><th>I0</th></tr><tr><td>Load / 3φ fault</td><td>✔</td><td>–</td><td>–</td></tr><tr><td>Phase-phase</td><td>✔</td><td>✔</td><td>–</td></tr><tr><td>Phase-ground</td><td>✔</td><td>✔</td><td>✔</td></tr><tr><td>Open phase</td><td>✔</td><td>✔</td><td>(depends)</td></tr></table>
<h3>How SEL uses them</h3><ul><li><b>51G / 50G</b> use 3I0.</li><li><b>51Q / 46</b> use 3I2.</li><li><b>32Q / 32V</b> directional elements compare I2 to V2 or I0 to V0 to find fault direction.</li><li><b>LOP</b> logic looks for V2/V0 without I2/I0 = a PT problem, not a fault.</li></ul>
<h3>Commissioning use</h3><p>Under balanced load, I2 and I0 should be close to zero. If MET shows a large 3I2 at normal load, a CT is reversed or a phase is swapped.</p>`,labs:[],
quiz:[{q:'Which needs a ground path?',o:['I1','I2','I0','All'],a:2,why:'Zero sequence returns through ground.'},
{q:'Phase-phase fault produces…',o:['I1 only','I1 and I2','I0 only','I1, I2 and I0'],a:1,why:'No ground involved.'},
{q:'Large 3I2 at normal balanced load means…',o:['Healthy','Wiring error (reversed/swapped CT)','Fault','Low PF'],a:1,why:'Balanced load has no I2.'}]},
{id:'pt4',phase:P,title:'CTs in depth: accuracy, burden and saturation',body:`
<h3>Accuracy class</h3><p>A relaying CT like <b>C400</b> can deliver 20× rated current (100 A secondary for a 5 A CT) into a burden while keeping error under 10%, as long as the voltage needed is below 400 V.</p>
<h3>Burden</h3><p>Everything the CT drives: relay input, leads (often the biggest part), test switches. Long cable runs to the control house add ohms.</p>
<h3>Saturation check</h3><p>Voltage needed ≈ I<sub>fault sec</sub> × R<sub>burden</sub>. Example: 20 kA fault, CT 1200:5 (CTR 240) → 83 A secondary. Burden 2 Ω → 167 V. C400 is fine. With a 600:5 CT (CTR 120): 167 A × 2 Ω = 333 V: close to the limit, and DC offset makes it worse (multiply by up to 1 + X/R).</p>
<h3>What saturation does</h3><p>The CT output collapses after part of each cycle. Overcurrent elements see less current and trip slower. Differential relays see a false difference and can trip on an external fault. SEL relays have saturation detection, but a correctly sized CT is the real fix.</p>
<h3>Choosing the tap</h3><p>Multi-ratio CTs (e.g. 1200:5 MR) have taps. A higher tap gives more voltage capability (less saturation) but less resolution at low current. Set the tap so max load is roughly 0.5–1× of 5 A and check saturation at max fault.</p>
<h3>Field tests</h3><ul><li><b>Ratio</b> and <b>polarity</b>.</li><li><b>Excitation curve</b> (knee point).</li><li><b>Insulation resistance</b> (megger).</li><li><b>Burden</b>: measure the loop resistance.</li></ul>`,labs:[],
quiz:[{q:'C400 means up to 400 V at…',o:['1× rated','20× rated current','Any current','Load'],a:1,why:'Standard 20× rating.'},
{q:'Biggest burden contributor is often…',o:['Relay','Lead resistance','CT core','PT'],a:1,why:'Long control cables.'},
{q:'Saturated CT on an external fault can make an 87 relay…',o:['Slower','Falsely trip','Read higher','Nothing'],a:1,why:'False differential current.'}]},
{id:'pt5',phase:P,title:'Time-overcurrent curves, by the numbers',body:`
<p>A 51 element's trip time comes from a formula. Knowing it lets you check a coordination study or a test result.</p>
<h3>The US curve equation (IEEE C37.112)</h3><p>t = TD × ( A ÷ (M<sup>p</sup> − 1) + B )</p><p>where <b>M</b> = current ÷ pickup (multiple of pickup), <b>TD</b> = time dial.</p>
<table><tr><th>SEL curve</th><th>Name</th><th>A</th><th>B</th><th>p</th></tr><tr><td>U1</td><td>Moderately inverse</td><td>0.0104</td><td>0.0226</td><td>0.02</td></tr><tr><td>U2</td><td>Inverse</td><td>5.95</td><td>0.180</td><td>2</td></tr><tr><td>U3</td><td>Very inverse</td><td>3.88</td><td>0.0963</td><td>2</td></tr><tr><td>U4</td><td>Extremely inverse</td><td>5.67</td><td>0.0352</td><td>2</td></tr></table>
<h3>Worked example</h3><p>U3, TD 2, pickup 4 A, test current 12 A → M = 3.</p><p>t = 2 × (3.88 ÷ (9 − 1) + 0.0963) = 2 × (0.485 + 0.0963) = <b>1.16 s</b>.</p>
<h3>Reading it</h3><ul><li>At M just above 1 the time gets very long. Never test pickup timing at M ≈ 1.1; test at M = 2, 3, 5.</li><li>Time dial scales the whole curve linearly.</li><li>Very/extremely inverse curves drop fast at high current: they coordinate with fuses, which are also steep.</li></ul>
<h3>Electromechanical reset</h3><p>SEL 51s can emulate an induction disk's slow reset (<code>51P1RS=Y</code>). Use it when coordinating with old electromechanical relays upstream, so repeated reclosing doesn't "build up" differently.</p>`,labs:[],
quiz:[{q:'M is…',o:['Time dial','Current ÷ pickup','Pickup ÷ current','Seconds'],a:1,why:'Multiple of pickup.'},
{q:'U3, TD 1, M = 5. Time ≈ (3.88/24 + 0.0963)',o:['0.26 s','1.6 s','0.05 s','2.6 s'],a:0,why:'0.162 + 0.096 = 0.258.'},
{q:'Doubling TD makes trip time…',o:['Halve','Double','Same','Square'],a:1,why:'Linear in TD.'}]},
{id:'pt6',phase:P,title:'Coordination step by step',body:`
<p>Coordination means the device closest to the fault trips first, and each device upstream waits a little longer.</p>
<h3>Coordination time interval (CTI)</h3><p>The gap between curves at the same fault current. Typical: <b>0.2–0.3 s</b> between relays (breaker time + overtravel + margin). With fuses, follow the fuse total-clearing curve.</p>
<h3>Procedure</h3><ol><li>Start at the most downstream device (smallest fuse or motor relay). Its curve is given.</li><li>Pick the next upstream relay's <b>pickup</b>: above max load (often 1.5–2× full load for phase) and below the minimum fault it must back up.</li><li>Pick a <b>curve shape</b> similar to the downstream device.</li><li>At the <b>maximum</b> fault current the downstream device sees, compute its time. Add CTI. Choose the TD that gives that time on the upstream curve.</li><li>Check the whole range: curves must not cross.</li><li>Set the <b>50</b> element above the max fault at the next downstream device (so it never trips for a fault beyond its zone), typically 125% of that value.</li></ol>
<h3>Worked mini-example</h3><p>Downstream relay trips in 0.30 s at 3,000 A. Upstream must trip at ≥ 0.60 s at 3,000 A (CTI 0.3). Upstream pickup 600 A (M = 5), U3: 0.60 = TD × (3.88/24 + 0.0963) = TD × 0.258 → TD ≈ <b>2.3</b>.</p>
<h3>Things that break coordination</h3><ul><li>Different curve families (U vs IEC) crossing at low current.</li><li>Fast reclosing heating fuses.</li><li>Cold-load pickup.</li><li>Distributed generation feeding the fault from below.</li></ul>`,labs:[],
quiz:[{q:'Typical CTI between relays:',o:['0.02 s','0.2–0.3 s','2 s','None'],a:1,why:'Breaker time + margin.'},
{q:'Downstream 0.4 s at fault; CTI 0.3. Upstream must be at least',o:['0.1 s','0.7 s','0.4 s','1.2 s'],a:1,why:'0.4 + 0.3.'},
{q:'Upstream 50 should be set…',o:['Below load','Above max fault at the next downstream device','At pickup of 51','Off always'],a:1,why:'So it never overreaches.'}]}]);

{id:'sl1',phase:P,title:'Workshop 1: the ten equations you will write most',body:`
<p>Most real SELogic is a handful of patterns. Learn these and you can read 90% of settings files.</p>
<h3>1. Trip equation</h3><pre>TR := 50P1 + 51P1T + 51G1T + 50G1</pre><p>Any protection element that should trip goes here, OR'd together.</p>
<h3>2. Trip unlatch</h3><pre>ULTR := !(50L + 52A)</pre><p>Release TRIP once current is gone and the breaker is open.</p>
<h3>3. Trip output</h3><pre>OUT101 := TRIP</pre>
<h3>4. Close from relay or SCADA, blocked by hot-line tag</h3><pre>CL := (SV03T + RB02) * !LT01</pre>
<h3>5. Remote trip from SCADA, only in remote mode</h3><pre>TR := ... + RB01 * !LT02</pre>
<h3>6. Alarm output (fail-safe)</h3><pre>OUT107 := !(HALARM + SALARM + 79LO)</pre><p>Output energized when healthy; drops on trouble or relay death.</p>
<h3>7. Torque-control a ground element</h3><pre>51G1TC := !LT03</pre><p>LT03 = "ground trip disabled" latch from a pushbutton.</p>
<h3>8. Hot-line tag latch</h3><pre>SET01 := R_TRIG PB02 * !LT01
RST01 := R_TRIG PB02 * LT01</pre>
<h3>9. Breaker failure timer</h3><pre>SV06 := TRIP * 50P2     SV06PU = 9.00 cyc
OUT103 := SV06T</pre>
<h3>10. Trip-circuit monitor</h3><pre>SV07 := 52A * !IN105    SV07PU = 300 cyc
OUT107 := !(... + SV07T)</pre>
<h3>How to read any equation</h3><ol><li>Find the result on the left: what does it drive?</li><li>Read each OR term separately: "this OR this OR this".</li><li>Within each term, read AND/NOT as conditions.</li><li>Look up every bit you don't know in the manual's Relay Word bit table.</li></ol>`,labs:[],
quiz:[{q:'OUT107 := !(HALARM + SALARM). When healthy OUT107 is…',o:['0','1'],a:1,why:'NOT of false = true: energized when healthy.'},
{q:'In CL := (SV03T + RB02) * !LT01, LT01 = 1 means…',o:['Close allowed','Close blocked (hot-line tag)','Trip','Nothing'],a:1,why:'!LT01 becomes 0.'},
{q:'Which bit releases TRIP?',o:['ULTR condition','TR','CL','79RI'],a:0,why:'Unlatch trip.'}]},
{id:'sl2',phase:P,title:'Workshop 2: timers in practice',body:`
<p>SV timers (SV01–SV16 on a 351S; SV01–SV32 or more on newer relays) have a pickup delay (PU) and a dropout delay (DO). Times are in <b>cycles</b> (60 per second).</p>
<h3>Pickup delay: "must be true for this long"</h3><pre>SV01 := 27P1      SV01PU = 120   SV01DO = 0</pre><p>SV01T asserts only if undervoltage lasts 2 s. Filters out short dips.</p>
<h3>Dropout delay: "stay true for this long after"</h3><pre>SV02 := R_TRIG 52A    SV02PU = 0   SV02DO = 600</pre><p>SV02T is 1 for 10 s after the breaker closes. Use it to block or raise 50 pickup during cold-load.</p>
<h3>Pulse generator</h3><pre>SV03 := R_TRIG PB04   SV03PU = 0   SV03DO = 30</pre><p>A clean 0.5 s pulse each time PB04 is pressed. Good for close commands.</p>
<h3>Debounce an input</h3><pre>SV04 := IN106    SV04PU = 2   SV04DO = 2</pre><p>Ignore contact bounce shorter than 2 cycles.</p>
<h3>Common mistakes</h3><ul><li>Using <code>SV01</code> instead of <code>SV01T</code> downstream. SV01 is the <i>input</i> to the timer; SV01T is the delayed output.</li><li>Thinking in seconds: 30 = 0.5 s, not 30 s.</li><li>A pickup timer resets the moment its input drops: if the input flickers, it never times out.</li></ul>
<h3>Conversion</h3><p>cycles = seconds × 60. 0.25 s = 15 cycles. 5 s = 300 cycles.</p>`,labs:['sim'],
quiz:[{q:'2 seconds in cycles:',o:['2','120','30','60'],a:1,why:'2 × 60.'},
{q:'Downstream logic should use…',o:['SV01','SV01T'],a:1,why:'SV01T is the timed output.'},
{q:'"Stay on 10 s after the breaker closes" uses…',o:['Pickup delay','Dropout delay'],a:1,why:'Dropout holds it on.'}]},
{id:'sl3',phase:P,title:'Workshop 3: latches and edges',body:`
<h3>Edge triggers</h3><ul><li><code>R_TRIG X</code> (or <code>/X</code>): 1 for one processing interval when X goes 0→1.</li><li><code>F_TRIG X</code> (or <code>\\X</code>): 1 for one interval when X goes 1→0.</li></ul><p>Use them for anything that should happen <i>once per press</i> or <i>once per event</i>: toggling, counting, pulsing.</p>
<h3>Latch bits (LT01…)</h3><p>Each has a SET and RST equation. Set wins? Check your relay: on SEL, if both are true, <b>reset</b> dominates on most models. Latches are stored in nonvolatile memory: they survive power loss.</p>
<h3>Why not a self-holding SV?</h3><p><code>SV01 := A + SV01 * !B</code> works but is lost on power cycle and on settings change. For any operator-selected mode, use a latch.</p>
<h3>Toggle with one button</h3><pre>SET02 := R_TRIG PB05 * !LT02
RST02 := R_TRIG PB05 * LT02
PB5_LED := LT02</pre><p>Without R_TRIG, holding the button would toggle every processing interval: flickering chaos.</p>
<h3>Lockout-style latch</h3><pre>SET03 := TRIP * 87R
RST03 := R_TRIG PB06 * !TRIP
CL    := ... * !LT03</pre><p>After a differential trip, closing is blocked until someone presses reset with the trip gone.</p>
<h3>Flash memory warning</h3><p>Latches write to nonvolatile memory. Don't build logic that sets and resets a latch every few cycles in normal operation; it wears the memory. Use SVs for fast-changing states.</p>`,labs:['chal'],
quiz:[{q:'Toggle logic without R_TRIG will…',o:['Work fine','Toggle repeatedly while held','Never toggle','Trip'],a:1,why:'Level, not edge.'},
{q:'Which survives a power cycle?',o:['SV self-hold','Latch bit LTxx','R_TRIG','Timer'],a:1,why:'Nonvolatile.'},
{q:'F_TRIG 52A pulses when…',o:['Breaker closes','Breaker opens'],a:1,why:'52A goes 1→0.'}]},
{id:'sl4',phase:P,title:'Workshop 4: math variables and counters',body:`
<p>Newer SEL relays (751, 787, 351S R5xx+) have <b>SELogic math</b>: math variables <code>MV01…</code> and counters <code>SC01…</code>.</p>
<h3>Counters</h3><pre>SC01LD := R_TRIG PB07     (load / reset)
SC01CU := R_TRIG TRIP      (count up)
SC01PV = 5                 (preset)
</pre><p><code>SC01</code> asserts when the count reaches 5. Use it to alarm after N trips (breaker maintenance) or N motor starts.</p>
<h3>Math variables</h3><pre>MV01 := IAFM + IBFM + ICFM
MV02 := MV01 / 3
SV08 := MV02 > 400</pre><p>Average phase current, and a bit when it exceeds 400 A primary. Analog quantity names (IAFM, MWP3…) come from the analog quantities table in the manual.</p>
<h3>Comparisons</h3><p><code>&gt;</code>, <code>&lt;</code>, <code>=</code> produce a bit you can use in logic.</p>
<h3>Typical uses</h3><ul><li>Custom load-shed: trip if MW import &gt; limit for 5 s.</li><li>Starts-per-hour limits on motors.</li><li>Scale a value for SCADA.</li></ul>
<h3>Execution order</h3><p>Equations run top to bottom every processing interval (typically ¼ or ½ cycle on protection logic, slower for automation logic). A variable used before it's computed holds last interval's value. When debugging odd one-interval delays, check the order.</p>
<h3>Protection vs automation logic</h3><p>The 751/787 separate fast <b>protection logic</b> from slower <b>automation logic</b> (bigger, ~100 ms). Never put trip decisions in automation logic.</p>`,labs:[],
quiz:[{q:'Counter output asserts when…',o:['Count reaches preset PV','Any count','Reset','Never'],a:0,why:'SCxx = count ≥ PV.'},
{q:'Trip decisions belong in…',o:['Automation logic','Protection logic'],a:1,why:'Speed and priority.'},
{q:'A variable used before it\'s calculated gets…',o:['Zero','Last interval\'s value','Error','Random'],a:1,why:'Top-to-bottom execution.'}]},
{id:'sl5',phase:P,title:'Workshop 5: debugging logic like a pro',body:`
<p>Logic doesn't work. Here's the order to find out why.</p>
<h3>1. Is the logic you think is in the relay actually in the relay?</h3><p>Read the settings back (<code>SHO L</code> or QuickSet read). Check the active group (<code>SG1…</code>): logic may differ per group.</p>
<h3>2. Watch the bits live</h3><p><code>TAR</code> shows a row of Relay Word bits. <code>TAR 51P1T</code> jumps to the row containing that bit. In QuickSet, the HMI / Relay Word bit viewer updates live.</p>
<h3>3. Break the equation apart</h3><p>For <code>TR := 51P1T * !LT03 + 50P1</code>: check 51P1T, LT03 and 50P1 separately while you create the condition. Which term is wrong?</p>
<h3>4. Add to SER</h3><p>Put every bit in the chain in the SER list (<code>SER1 := 51P1,51P1T,LT03,TRIP,OUT101,IN101</code>). Run the test. Read <code>SER</code>: millisecond-stamped order of what happened. This is the single most powerful tool.</p>
<h3>5. Use event reports</h3><p>Trigger an event (<code>TRI</code> command or ER equation). The report shows analog waveforms and the digital bits row by row. Use it to see whether an element picked up at all.</p>
<h3>6. Check the physical layer</h3><p>Output closed but breaker didn't trip? Measure at the terminal block. Input not asserting? Measure DC at the relay input terminals. Check input pickup voltage setting.</p>
<h3>Classic culprits</h3><ul><li>Element torque-controlled off (<code>51P1TC</code>).</li><li>Element enabled setting off (<code>E50P = N</code>).</li><li>Wrong group active.</li><li>Used SV instead of SVT.</li><li>Test switch open.</li></ul>`,labs:[],
quiz:[{q:'Best tool to see the order bits changed?',o:['MET','SER','HIS','ID'],a:1,why:'Millisecond timestamps.'},
{q:'Logic works in group 1, not after switching. Check…',o:['CT ratio','Group 2 logic and enables','Battery','Firmware'],a:1,why:'Settings differ per group.'},
{q:'Output contact closes but breaker doesn\'t trip. Next step?',o:['Change logic','Measure at terminal blocks / trip circuit','Reboot relay','Raise pickup'],a:1,why:'Logic is done; it\'s the physical circuit.'}]}]);

{id:'ts1',phase:P,title:'Your test set and how to hook it up',body:`
<p>A relay test set (Omicron CMC, Doble F6150, Megger SMRT, Manta) is a programmable source of currents and voltages with timers and binary inputs.</p>
<h3>Connections</h3><ul><li><b>Current outputs</b> → relay current inputs through the test plug in the FT-1 switch. IA, IB, IC and a return (N).</li><li><b>Voltage outputs</b> → relay voltage inputs (VA, VB, VC, N).</li><li><b>Binary inputs</b> ← relay output contacts (trip, close, alarm). The test set stops its timer when the contact closes.</li><li><b>Binary outputs</b> (optional) → relay contact inputs, to simulate 52a or other signals.</li></ul>
<h3>Wet vs dry contacts</h3><p>A relay output contact is "dry": just a switch. The test set binary input can be set to detect a dry contact, or to look for voltage if the contact is in a live DC circuit ("wet"). Set it to match or the timer never stops.</p>
<h3>Check before you inject</h3><ol><li>Trips isolated (paddles open), currents shorted at the CT side, voltages isolated from PTs.</li><li>Test plug in, leads checked against the three-line.</li><li>Start low: inject a balanced 1 A and read <code>MET</code>. Magnitudes and angles must match what you inject. This proves your hookup before any real test.</li></ol>
<h3>Secondary vs primary values</h3><p>Test sets inject secondary values. Convert all study values: pickup 480 A primary, CTR 120 → 4 A secondary.</p>`,labs:[],
quiz:[{q:'First injection should be…',o:['Max fault','Low balanced current + check MET','Pickup','Nothing'],a:1,why:'Prove the hookup.'},
{q:'Test set timer doesn\'t stop though relay trips. Likely?',o:['Wrong curve','Binary input wet/dry setting wrong','CTR','Group'],a:1,why:'Input not detecting the contact.'},
{q:'Relay output contacts go to the test set\'s…',o:['Current outputs','Binary inputs','Voltage outputs','Ground'],a:1,why:'To stop the timer.'}]},
{id:'ts2',phase:P,title:'Testing overcurrent: pickup, timing, instantaneous',body:`
<h3>Pickup</h3><ol><li>Isolate other elements that might trip first (or watch the specific bit via TAR/SER instead of the trip output).</li><li>Ramp current slowly up from ~90% of pickup until the element bit asserts. Record.</li><li>Ramp down until it drops out. Record (dropout typically ~95% of pickup).</li><li>Pass if within tolerance (±5% or per manual, plus ±0.01–0.05 A floor at low settings).</li></ol>
<h3>Timing</h3><ul><li>Step from 0 to 2×, 3×, 5× pickup and time to trip.</li><li>Compare to the curve equation: U3, TD 2, M 3 → 1.16 s. Tolerance usually ±1.5 cycles or ±5%, whichever is greater.</li></ul>
<h3>Instantaneous (50)</h3><ul><li>Pickup: apply short shots just below and just above. Ramping slowly may let the 51 trip first.</li><li>Timing: apply 1.2–2× pickup; expect ~1–1.5 cycles plus output contact time.</li></ul>
<h3>Ground elements</h3><p>Inject on one phase only. Residual 3I0 = that current. Check that phase elements don't operate first; you may need to inject below phase pickup.</p>
<h3>Negative sequence</h3><p>Inject a single phase: 3I2 = I<sub>phase</sub> (single-phase injection gives I1 = I2 = I0 = I/3). Or swap two phases of a balanced set: pure negative sequence.</p>
<h3>Record everything</h3><p>Setting, expected, measured, % error, pass/fail. A test sheet with "OK" and no numbers is worthless at the next audit.</p>`,labs:[],
quiz:[{q:'Why use short shots for 50 pickup?',o:['Faster','So the 51 doesn\'t trip first','Required','Less heat only'],a:1,why:'Slow ramps time out the 51.'},
{q:'Single-phase injection of 3 A: 3I2 =',o:['1 A','3 A','9 A','0'],a:1,why:'I2 = I/3, so 3I2 = I.'},
{q:'Expected 50 trip time:',o:['~1–1.5 cycles + contact','1 s','5 cycles','Per curve'],a:0,why:'Instantaneous.'}]},
{id:'ts3',phase:P,title:'Testing differential: slope with real numbers',body:`
<p>87 compares currents entering and leaving. Two quantities:</p><ul><li><b>Operate</b> I<sub>op</sub> = |I1 + I2| (the difference; currents defined into the zone).</li><li><b>Restraint</b> I<sub>rt</sub> = (|I1| + |I2|) ÷ 2 (on SEL 787, the average; check your model).</li></ul><p>Values are in <b>per unit of TAP</b>: TAP = full-load current on that winding's CT secondary.</p>
<h3>Characteristic</h3><p>Trips if I<sub>op</sub> &gt; O87P (minimum, e.g. 0.3 pu) AND I<sub>op</sub> &gt; SLP1% × I<sub>rt</sub> (e.g. 25%), with SLP2 (e.g. 50%) above a breakpoint.</p>
<h3>Testing one slope point</h3><p>Inject winding 1 and winding 2, 180° apart (through current) at 2 pu restraint. Slowly raise winding 1 until trip.</p><ul><li>Expected: I<sub>op</sub> = 0.25 × I<sub>rt</sub>.</li><li>With I1 = 2 + x/2 and I2 = 2 − x/2 (pu): I<sub>rt</sub> = 2, trip at I<sub>op</sub> = x = 0.5 pu.</li></ul><p>Convert pu to amps: multiply by each winding's TAP.</p>
<h3>Don't forget the angle shift</h3><p>For a Δ-Y transformer with compensation, injecting single phase on one side shows up on two phases after compensation. Use the test set's built-in differential module, or inject three-phase balanced sets with the right angle shift (e.g. 30°).</p>
<h3>Harmonic blocking</h3><p>Inject fundamental + 2nd harmonic. Increase 2nd harmonic % until the element is blocked. Compare to <code>PCT2</code> (e.g. 15%).</p>`,labs:['slope'],
quiz:[{q:'Restraint 3 pu, slope 25%. Minimum operate to trip:',o:['0.25 pu','0.75 pu','3 pu','0.3 pu'],a:1,why:'0.25 × 3.'},
{q:'TAP means…',o:['Time dial','Full-load current on CT secondary for that winding','CT ratio','Slope'],a:1,why:'Per-unit base.'},
{q:'2nd harmonic % test checks…',o:['Slope','Inrush blocking','Pickup','Polarity'],a:1,why:'PCT2 setting.'}]},
{id:'ts4',phase:P,title:'Reading SEL event reports',body:`
<p>Every trip produces an <b>event report</b>. Reading them is half of protection engineering.</p>
<h3>Getting them</h3><ul><li><code>HIS</code>: list of events with time, type, max current.</li><li><code>EVE n</code>: the full report for event n, in text (filtered, 4 samples/cycle).</li><li><code>CEV n</code>: compressed raw, opened in <b>SEL-5601 / SYNCHROWAVE Event</b> for waveforms.</li><li>QuickSet: Tools → Events → Get Event Files.</li></ul>
<h3>What's in it</h3><ul><li><b>Analog</b>: IA, IB, IC, IN, VA, VB, VC, each sample.</li><li><b>Digital</b>: element and logic bits per sample: pickups, trips, outputs, inputs.</li><li><b>Summary</b>: fault type (e.g. "AG T" = A-to-ground, trip), fault location estimate, currents, duration.</li><li><b>Settings</b> at the time of the event.</li></ul>
<h3>A standard read</h3><ol><li>Which phases have high current? That's the fault type. Voltage dip on the same phases confirms.</li><li>When did the first element pick up? When did TRIP assert? (Relay time.)</li><li>When did current go to zero? (Breaker time = current zero − TRIP.)</li><li>Did the right element trip? Did anything misbehave (a directional element wrong, a 50 that should have operated)?</li><li>Compare with the other end of the line / upstream relay if time synced.</li></ol>
<h3>Typical numbers</h3><p>Relay time 1–2 cycles for instantaneous, breaker time 3–5 cycles. Total clearing ~5–8 cycles for a close-in fault.</p>`,labs:['rec'],
quiz:[{q:'Summary says "BC T". Fault type?',o:['B-ground','B-C phase-phase','Three-phase','C-ground'],a:1,why:'Two phases, no G.'},
{q:'Breaker time is measured from…',o:['Fault start to trip','TRIP assert to current zero','Pickup to TRIP','Reclose to close'],a:1,why:'Breaker interrupting time.'},
{q:'Waveform viewer for CEV files:',o:['Excel','SYNCHROWAVE Event / 5601','HIS','MET'],a:1,why:'SEL analysis software.'}]},
{id:'ts5',phase:P,title:'In-service checks and end-to-end tests',body:`
<p>Bench tests prove the relay. In-service checks prove the <b>wiring</b>: the thing that actually causes most misoperations.</p>
<h3>Load checks (with the feeder in service)</h3><ul><li><code>MET</code>: magnitudes reasonable vs SCADA / panel meters.</li><li>Phase angles: IA, IB, IC 120° apart, sequence A-B-C (or A-C-B where that's the system rotation; check <code>PHROT</code>).</li><li>Current lags voltage by the load angle (e.g. ~20–30° for normal lagging PF). If current leads by 150°, the CTs are reversed.</li><li>3I2, 3I0 near zero at balanced load.</li><li>Power flow sign correct: MW out of the bus toward load = positive (per your relay's convention).</li><li>Differential relays: operate current near zero, restraint matches load in pu. Use <code>MET DIF</code>.</li><li>Directional elements: check the forward/reverse bits agree with known power flow.</li></ul>
<h3>Trip checks</h3><p>Trip the actual breaker from the relay at least once (with operations permission). Confirm the right breaker opens and 52a/52b change at the relay inputs.</p>
<h3>End-to-end (line schemes)</h3><p>Both line terminals' test sets, GPS-synced, play the same fault simulation at the same instant. Proves pilot schemes (POTT, DCB, 87L) including the communication channel.</p>
<h3>SCADA point-to-point</h3><p>Every point on the list, with the master operator confirming name and state.</p>
<h3>Leaving site</h3><p>Every test switch closed, targets and SER cleared, alarms clear, defeated list restored, as-left saved, drawings redlined.</p>`,labs:[],
quiz:[{q:'Current leads voltage by ~150° on a normal load feeder. Likely?',o:['Healthy','Reversed CTs','Low PF','Overload'],a:1,why:'180° off from the expected ~-30°.'},
{q:'87 in service at load: operate current should be…',o:['≈ restraint','Near zero','Max','Equal to load'],a:1,why:'Through current cancels.'},
{q:'End-to-end tests prove…',o:['One relay','Both terminals + communication channel together','CT ratio','Battery'],a:1,why:'Synchronized simulation at both ends.'}]},
{id:'ts6',phase:P,title:'Troubleshooting playbook: misoperations',body:`
<p>When a relay trips wrongly or fails to trip, follow the evidence, not your hunch.</p>
<h3>Step 1: Collect</h3><p>Event reports from every relay that saw it, SER, HIS, settings as they were, recent work orders. Ask what changed.</p>
<h3>Step 2: Classify</h3><ul><li><b>Failure to trip</b>: was the element picked up? If no: settings/wiring/measurement. If yes but no TRIP: logic. If TRIP but no breaker op: trip circuit/breaker.</li><li><b>Unwanted trip</b>: which element? Was there a real fault? If external fault: directional, CT saturation, coordination. If no fault: inrush, load encroachment, noise, DC ground, wiring work.</li><li><b>Slow trip</b>: wrong curve/TD, torque control, wrong group.</li></ul>
<h3>Usual root causes, ranked</h3><ol><li>Wiring and CT/PT errors (polarity, ratio, swapped phases, open circuits).</li><li>Settings errors (wrong CTR, group, enables, logic typo).</li><li>Human error during testing/maintenance (test switch left open, isolation missed).</li><li>Design issues (no inrush restraint, CT undersized).</li><li>Relay hardware failure — the least common.</li></ol>
<h3>Step 3: Prove it</h3><p>Reproduce the event with the test set by playing back the COMTRADE file from the event report (state sequence or playback). If the relay does the same thing again, you have the cause.</p>
<h3>Step 4: Fix and document</h3><p>Correct, retest the affected function, write a short report: what happened, why, what changed, how verified.</p>`,labs:['cases'],
quiz:[{q:'Most common misoperation cause:',o:['Relay hardware','Wiring/CT/PT errors','Firmware','Lightning'],a:1,why:'Physical wiring dominates.'},
{q:'Element picked up, TRIP never asserted. Look at…',o:['CT wiring','Logic/TR equation','Breaker','Battery'],a:1,why:'Measurement worked; logic didn\'t pass it.'},
{q:'Best proof of a root cause:',o:['A guess','Replay the event (COMTRADE) and reproduce','Swap the relay','Raise pickups'],a:1,why:'Reproduction confirms.'}]}]);

{id:'r351a',phase:P,title:'351S walkthrough: setting a feeder from scratch',body:`
<p>A complete feeder setting, start to finish. 13.8 kV feeder, 600:5 CTs, 14,400:120 PTs, max load 350 A, min end-of-line fault 1,400 A (φ-φ), max close-in fault 9,000 A, downstream largest fuse 100T.</p>
<h3>1. Global and ratios</h3><ul><li><code>CTR = 120</code> (600/5). <code>PTR = 120</code> (14,400/120).</li><li><code>NFREQ = 60</code>, <code>PHROT = ABC</code>.</li><li>Set <code>DATE_F</code>, relay ID <code>RID</code>, terminal ID <code>TID</code> to match the one-line names.</li></ul>
<h3>2. Phase 51</h3><ul><li>Pickup: 1.5 × 350 = 525 A → 600 A primary for margin → 600 ÷ 120 = <code>51P1P = 5.00</code>.</li><li>Check: 1,400 ÷ 600 = 2.3× at the minimum fault. OK (aim ≥ 2×).</li><li>Curve <code>U4</code> (extremely inverse) to coordinate with T-fuses. TD from the study, e.g. <code>51P1TD = 3.0</code>.</li></ul>
<h3>3. Phase 50</h3><p>Must not see through the first downstream protective device. If the max fault at the first downstream recloser is 4,000 A: 1.25 × 4,000 = 5,000 A → <code>50P1P = 41.67</code>.</p>
<h3>4. Ground 51G</h3><p>Pickup ~ 20–50% of phase pickup depending on unbalance: 240 A → <code>51G1P = 2.00</code>, curve <code>U4</code>, TD per study.</p>
<h3>5. Reclosing</h3><p><code>E79 = 3</code>, <code>79OI1 = 30</code> (0.5 s), <code>79OI2 = 900</code> (15 s), <code>79OI3 = 1800</code>, <code>79RSD = 1800</code>.</p>
<h3>6. Fuse saving (optional)</h3><p>First shot: a fast 50 trips before the fuse blows (temporary fault clears, fuse saved). After shot 1, block the fast element so the fuse clears a permanent fault:</p><pre>TR := 51P1T + 51G1T + 50P1 + 50P2 * 79RS</pre><p>50P2 is the fast fuse-saving element, active only when the recloser is reset (first trip).</p>
<h3>7. Logic and I/O</h3><pre>OUT101 := TRIP
OUT102 := CLOSE
OUT107 := !(HALARM + SALARM + 79LO)
52A    := IN101
79RI   := R_TRIG TRIP
79DTL  := LT01 + SV06T</pre>
<h3>8. SER and events</h3><p><code>SER1 := 51P1,51P1T,50P1,51G1T,TRIP,CLOSE,52A,79LO,79CY,LT01</code></p>`,labs:[],
quiz:[{q:'Max load 400 A, CTR 120. 51P pickup at 1.5×?',o:['3.33 A','5.00 A','6.00 A','400 A'],a:1,why:'600 ÷ 120.'},
{q:'Fuse saving uses a fast element only…',o:['Always','On the first shot (79RS)','After lockout','Never'],a:1,why:'Then lets the fuse clear permanent faults.'},
{q:'Why set 50 at 1.25× of the downstream device\'s max fault?',o:['Speed','So it never trips for faults past that device','Load','Inrush'],a:1,why:'Selectivity with margin.'}]},
{id:'r351b',phase:P,title:'351S: pilot schemes (POTT, DCB, DTT)',body:`
<p>Distance Zone 1 only covers ~80% of the line instantly. The last 20% waits for Zone 2. <b>Pilot schemes</b> use communication between the two line ends to trip instantly for 100% of the line.</p>
<h3>POTT: permissive overreaching transfer trip</h3><ul><li>Each end has an overreaching forward element (Zone 2 or 67 forward).</li><li>If it sees a forward fault, it sends <b>permission</b> (KEY) to the other end.</li><li>Trip when <i>my</i> forward element picks up AND I <i>receive</i> permission (PT).</li><li>Fails safe: if the channel is lost, no fast trip (Zone 2 time still works).</li><li>351S: <code>ECOMM = POTT</code>, transmit <code>KEY</code> to an output/MIRRORED BIT, receive into <code>PT1</code>.</li></ul>
<h3>DCB: directional comparison blocking</h3><ul><li>Each end sends a <b>block</b> signal if it sees a <i>reverse</i> fault.</li><li>Trip if forward element + short coordination timer and NO block received.</li><li>Fast, works with weak channels (power line carrier), but if the channel fails it can overtrip for external faults.</li></ul>
<h3>DTT: direct transfer trip</h3><p>Receiving end trips unconditionally. Used for breaker failure or transformer protection without a local breaker.</p>
<h3>Special logic</h3><ul><li><b>Current reversal guard</b>: on parallel lines, fault current can reverse direction when one end trips. Blocks POTT briefly.</li><li><b>Weak-infeed echo</b>: an end with little source echoes permission back so the strong end can trip.</li></ul>
<h3>Channels</h3><p>Fiber with SEL <b>MIRRORED BITS</b> (relay-to-relay, ~4–8 ms), power line carrier, microwave, or GOOSE across a WAN. Monitor channel health (<code>ROKA</code>, <code>CBADA</code>) and alarm.</p>`,labs:[],
quiz:[{q:'POTT trips when…',o:['Any forward element','Forward element + permission received','Block received','Zone 1 only'],a:1,why:'Both ends agree it\'s forward.'},
{q:'DCB channel fails. Risk?',o:['No trips','Overtrip on external faults','Slow trips only','None'],a:1,why:'Missing block = permissive.'},
{q:'SEL relay-to-relay fiber protocol:',o:['DNP3','MIRRORED BITS','Modbus','SNTP'],a:1,why:'Fast digital bits.'}]}]);

{id:'r751c',phase:P,title:'751 walkthrough: distributed generation and directional',body:`
<p>Solar or a generator on a feeder changes everything: current can come from both directions, and the feeder relay may see fault current from the DG for faults on adjacent feeders.</p>
<h3>Problems DG causes</h3><ul><li><b>Sympathetic tripping</b>: fault on feeder 2; DG on feeder 1 back-feeds the fault through feeder 1's breaker → feeder 1 trips too.</li><li><b>Protection blinding</b>: DG supplies part of the fault, so the substation relay sees less current and trips slower.</li><li><b>Islanding</b>: substation opens, DG keeps the feeder alive. Dangerous for crews, and reclosing onto an island out of phase damages everything.</li></ul>
<h3>Fixes in the 751</h3><ul><li><b>Directional torque control</b>: <code>51P1TC := 32PF</code>, <code>51G1TC := 32GF</code> so the feeder relay only trips for forward faults.</li><li><b>Reclose supervision</b>: <code>79CLS := 27S</code> or dead-line check, so you never reclose onto a live island. Longer open intervals to let DG anti-islanding trip first.</li><li><b>Reverse power</b> (32): alarm or trip if MW flows back toward the substation beyond the DG export limit.</li></ul>
<h3>Directional settings</h3><ul><li><code>ORDER = QV</code> (negative-sequence first, then zero-sequence voltage polarized).</li><li><code>Z2F</code>/<code>Z2R</code>: forward/reverse thresholds; auto-calculated on <code>E32 = AUTO</code> from line impedance.</li><li>Directional elements need voltage: supervise with LOP.</li></ul>
<h3>Testing directional</h3><p>Inject a fault with known angle (e.g. A-G, current lagging voltage by the line angle): <code>32GF</code> should assert. Rotate current 180°: <code>32GR</code> should assert instead.</p>`,labs:[],
quiz:[{q:'DG on feeder 1 makes feeder 1 trip for a fault on feeder 2. Name?',o:['Blinding','Sympathetic tripping','Islanding','Inrush'],a:1,why:'Back-feed through healthy breaker.'},
{q:'Fix for sympathetic tripping:',o:['Raise TD','Directional torque control (forward only)','Remove 50','Lower CTR'],a:1,why:'Ignore reverse faults.'},
{q:'Never reclose onto an island. Supervise 79CLS with…',o:['50P','Dead-line (27) check','46','PB1'],a:1,why:'Only close when line is dead.'}]}]);

{id:'r787d',phase:P,title:'787 walkthrough: TAP, compensation and settings from a nameplate',body:`
<p>Nameplate: 20 MVA, 115 kV delta / 13.8 kV grounded wye (Dyn1: low side lags high by 30°). HV CTs 200:5 wye, LV CTs 1200:5 wye.</p>
<h3>1. Full-load currents</h3><ul><li>HV: 20,000 ÷ (1.732 × 115) = 100.4 A primary.</li><li>LV: 20,000 ÷ (1.732 × 13.8) = 836.7 A primary.</li></ul>
<h3>2. TAP (secondary full load)</h3><ul><li><code>TAP1</code> = 100.4 ÷ 40 = <b>2.51 A</b> (CTR1 = 40).</li><li><code>TAP2</code> = 836.7 ÷ 240 = <b>3.49 A</b> (CTR2 = 240).</li><li>The 787 calculates these automatically from <code>MVA</code>, <code>VWDG1</code>, <code>VWDG2</code>, <code>CTR1</code>, <code>CTR2</code>. Check TAP ratio ≤ the manual's limit (e.g. 7.5).</li></ul>
<h3>3. Compensation</h3><p>Both CT sets wye-connected; the relay corrects the 30° shift and removes zero sequence mathematically. Choose the compensation settings (<code>W1CTC</code>/<code>W2CTC</code>) from the 787 manual's table for your vector group and CT connections. Don't guess them. <b>Prove it in service</b> with <code>MET DIF</code>: operate current near zero at load.</p>
<h3>4. Differential settings</h3><ul><li><code>O87P = 0.30</code> pu minimum operate.</li><li><code>SLP1 = 25</code>%, <code>SLP2 = 50</code>%, breakpoint <code>IRS1 = 3.0</code> pu.</li><li><code>U87P = 10</code> pu unrestrained (above max inrush, below max internal fault).</li><li><code>PCT2 = 15</code>%, <code>PCT5 = 35</code>%. Enable cross-blocking or harmonic restraint per utility practice.</li></ul>
<h3>5. Backup overcurrent</h3><p>HV 51 pickup ~ 1.5–2× full load: 200 A primary → 5.0 A. Coordinate below transformer damage curve (ANSI through-fault curve) and above LV feeder relays.</p>
<h3>6. Trip logic</h3><pre>TR1 := 87R + 87U + REF1F + 51P1T + IN104
TR2 := TR1
OUT101 := TRIP1     (HV breaker / 86)
OUT102 := TRIP2     (LV breaker)</pre>`,labs:['tap','slope'],
quiz:[{q:'10 MVA, 69 kV, CTR 30. TAP?',o:['2.79 A','83.7 A','8.37 A','1.45 A'],a:0,why:'10,000/(1.732×69)=83.7 A ÷ 30.'},
{q:'U87P should be set…',o:['Below load','Above max inrush, below max internal fault','At O87P','Off'],a:1,why:'Unrestrained only for severe internal faults.'},
{q:'Proof compensation is right in service:',o:['MET DIF operate ≈ 0','HIS','ID','Fan runs'],a:0,why:'Through load must cancel.'}]}]);

{id:'d1',phase:P,title:'Drill 1: ratios and conversions',body:`<p>Work each one on paper first, then open the answer. Speed comes from repetition.</p>`+
D('1. 1200:5 CT. CTR?','240.')+
D('2. CTR 240, relay reads 2.5 A. Primary?','2.5 × 240 = 600 A.')+
D('3. Study pickup 720 A primary, CTR 160. Secondary setting?','720 ÷ 160 = 4.50 A.')+
D('4. PT 7,200:120. PTR?','60.')+
D('5. PTR 60, relay reads 118 V. Primary?','118 × 60 = 7,080 V (phase-to-neutral).')+
D('6. 12.47 kV line-to-line. Phase-to-neutral?','12,470 ÷ 1.732 = 7,200 V.')+
D('7. 0.5 seconds in cycles (60 Hz)?','30 cycles.')+
D('8. 45 cycles in seconds?','0.75 s.')+
D('9. 5 MVA at 4.16 kV full-load current?','5,000 ÷ (1.732 × 4.16) = 694 A.')+
D('10. Line impedance 12 Ω primary, CTR 200, PTR 1000. Secondary?','12 × 200 ÷ 1000 = 2.4 Ω.'),labs:[],
quiz:[{q:'CTR 80, pickup 3 A sec. Primary?',o:['240 A','26.7 A','83 A','3 A'],a:0,why:'3 × 80.'},
{q:'0.25 s =',o:['15 cycles','25 cycles','4 cycles','60 cycles'],a:0,why:'0.25 × 60.'},
{q:'34.5 kV L-L, phase-to-neutral ≈',o:['19.9 kV','59.8 kV','34.5 kV','11.5 kV'],a:0,why:'÷ 1.732.'}]},
{id:'d2',phase:P,title:'Drill 2: curves and coordination',body:`<p>U3: A 3.88, B 0.0963, p 2. U4: A 5.67, B 0.0352, p 2. t = TD × (A ÷ (M² − 1) + B).</p>`+
D('1. U3, TD 1, M 2. Time?','3.88 ÷ 3 + 0.0963 = 1.39 s.')+
D('2. U3, TD 4, M 2?','4 × 1.39 = 5.56 s.')+
D('3. U4, TD 1, M 5?','5.67 ÷ 24 + 0.0352 = 0.271 s.')+
D('4. Pickup 5 A, test 15 A, U3 TD 2?','M = 3. 2 × (3.88 ÷ 8 + 0.0963) = 1.16 s.')+
D('5. Downstream clears 0.25 s at 2,400 A. CTI 0.3. Upstream pickup 400 A, U3. TD?','M = 6. Curve at TD 1: 3.88 ÷ 35 + 0.0963 = 0.207 s. Need 0.55 s → TD = 2.66.')+
D('6. Why not test timing at M = 1.1?','The curve is nearly vertical there; a tiny current error gives a huge time error.')+
D('7. Max load 300 A, min fault 900 A. Is 450 A pickup OK?','1.5× load, 2× min fault. Yes, at the edge.')+
D('8. Max fault at downstream recloser 3,200 A. Upstream 50 pickup?','~1.25 × 3,200 = 4,000 A primary.'),labs:['curve'],
quiz:[{q:'U3, TD 2, M 2:',o:['2.78 s','1.39 s','0.69 s','5.56 s'],a:0,why:'2 × 1.39.'},
{q:'Upstream must clear 0.3 s after 0.2 s downstream. Target:',o:['0.5 s','0.1 s','0.3 s','0.6 s'],a:0,why:'0.2 + 0.3.'},
{q:'TD 3 → TD 1.5 makes time',o:['Half','Double','Same'],a:0,why:'Linear.'}]},
{id:'d3',phase:P,title:'Drill 3: read the logic',body:`<p>Give the output value for each case.</p>`+
D('1. TR := 51P1T + 50P1. 51P1T=0, 50P1=1.','TR = 1.')+
D('2. CL := SV03T * !LT01. SV03T=1, LT01=1.','CL = 0 (hot-line tag blocks).')+
D('3. OUT107 := !(HALARM + 79LO). Both 0.','OUT107 = 1 (healthy, energized).')+
D('4. Relay loses DC power. OUT107 state?','De-energized = alarm. That\'s why it\'s fail-safe.')+
D('5. SV01 := 27P1, SV01PU = 60. 27P1 true for 45 cycles then drops. SV01T?','Never asserts; input dropped before 60.')+
D('6. SET01 := R_TRIG PB01 * !LT01; RST01 := R_TRIG PB01 * LT01. LT01=0, press PB01 twice.','Press 1 → 1. Press 2 → 0.')+
D('7. Write: trip if 51G1T, but only when ground trip is enabled (LT03 = enabled).','TR := ... + 51G1T * LT03 (or torque control 51G1TC := LT03).')+
D('8. Write: alarm if breaker is closed but trip-circuit input IN105 is off for 5 s.','SV07 := 52A * !IN105, SV07PU = 300; alarm on SV07T.')+
D('9. Find the bug: SV02 := TRIP * 50P2, SV02PU = 9; OUT103 := SV02.','Uses SV02, not SV02T: breaker-failure output fires instantly.')+
D('10. Find the bug: SV05 := A + SV05.','Seals in forever; no reset term. Use SV05 := A + SV05 * !B.'),labs:['selogic'],
quiz:[{q:'TR := A * !B. A=1, B=1.',o:['1','0'],a:1,why:'!B = 0.'},
{q:'Using SVn instead of SVnT skips…',o:['The timer delay','The logic','Nothing'],a:0,why:'SVn is the timer input.'},
{q:'Fail-safe alarm on relay death:',o:['Stays quiet','Alarms'],a:1,why:'Output drops.'}]},
{id:'d4',phase:P,title:'Drill 4: read the meter',body:`<p>Each is a MET reading under normal load. Say whether it is healthy and, if not, what's wrong.</p>`+
D('1. IA 2.0∠−25°, IB 2.0∠−145°, IC 2.0∠95°. 3I2 ≈ 0.','Healthy: 120° apart, balanced, ABC.')+
D('2. IA 2.0∠−25°, IB 2.0∠35°, IC 2.0∠95°.','IB is 180° off: B-phase CT reversed. Large 3I2.')+
D('3. IA 2.0∠−25°, IB 2.0∠95°, IC 2.0∠−145°.','B and C swapped: negative-sequence rotation (ACB).')+
D('4. IA 2.0, IB 2.0, IC 0.0, all angles fine otherwise.','C-phase CT open or shorted at test switch; IC lost. Check C paddle.')+
D('5. MW = −3.2 on a radial load feeder.','Power appears to flow into the bus: all three CTs reversed (or PT polarity). Check polarity.')+
D('6. IA lags VA by 160°.','Current reversed relative to voltage (normal is ~20–30° lag).')+
D('7. 787 MET DIF: IOP1 0.9 pu at full load.','Mismatch: wrong TAP, compensation or a CT phase/polarity error. Do not put 87 in service.')+
D('8. VA 67 V, VB 67 V, VC 0 V.','C-phase PT fuse blown or open; LOP should assert.'),labs:['phasor'],
quiz:[{q:'IB 180° from expected:',o:['Healthy','B CT reversed','Overload','Ground fault'],a:1,why:'Polarity.'},
{q:'B and C swapped shows as…',o:['ACB rotation','Zero current','High PF'],a:0,why:'Reverse sequence.'},
{q:'IOP ≈ 0.9 pu at load means',o:['Normal','Setting/wiring error','Inrush'],a:1,why:'Through current should cancel.'}]},
{id:'d5',phase:P,title:'Drill 5: read the event',body:`<p>Each is a summary from an event report. Say what happened and whether the relay did the right thing.</p>`+
D('1. "AG T", IA 3,100 A, IB/IC ~load, VA dipped. 51G1T then TRIP at 22 cycles. Current zero 4 cycles later.','A-ground fault, cleared by time ground overcurrent. Relay time 22 cyc, breaker 4 cyc. Correct.')+
D('2. "ABC T", all three ~8,000 A, 50P1 + TRIP in 1.2 cycles.','Three-phase close-in fault, instantaneous trip. Correct.')+
D('3. Transformer energized, 87R TRIP, currents 6× rated only on one side, decaying, no voltage dip on LV.','Looks like inrush: check 2nd harmonic content and PCT2 / blocking settings. Likely misoperation.')+
D('4. Feeder tripped on 51P1T at 1.1× pickup during a hot afternoon, no fault, slowly rising currents.','Overload, not a fault. Pickup too close to load; review load data.')+
D('5. TRIP asserted, current stayed for 14 cycles, then bus lockout operated.','Breaker failed to interrupt; breaker failure worked. Inspect the breaker.')+
D('6. Feeder 1 tripped on 51G1T for a fault on feeder 2; feeder 1 has a solar farm.','Sympathetic trip from DG back-feed. Add directional control.')+
D('7. TRIP asserted, no change in current, 52A stayed 1.','Trip circuit failed: open trip coil, DC fuse, or test switch left open.'),labs:['rec'],
quiz:[{q:'One-sided decaying current at energization →',o:['Inrush','Internal fault','Overload'],a:0,why:'Classic inrush.'},
{q:'TRIP but current flows 14 cycles →',o:['Breaker failure','Slow relay','Normal'],a:0,why:'Breaker didn\'t interrupt.'},
{q:'TRIP and nothing changes, 52A=1 →',o:['Trip circuit problem','CT saturation','LOP'],a:0,why:'Command never reached the breaker.'}]}]);
