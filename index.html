{id:'pi1',phase:P,title:'Annunciator sequences (ISA-18.1) in depth',body:`
<p>An annunciator window has a few states, and the <b>sequence</b> defines how it moves between them. ISA-18.1 names them with letters.</p>
<h3>The states</h3><ul><li><b>Normal</b>: window dark, horn quiet.</li><li><b>Alert</b>: alarm just came in. Window <b>flashing</b>, horn sounding.</li><li><b>Acknowledged</b>: operator pressed ACK. Window <b>steady on</b>, horn silenced.</li><li><b>Return to normal</b>: the field condition cleared. Depends on the sequence.</li></ul>
<h3>Common sequences</h3><table><tr><th>Seq</th><th>Behaviour</th></tr><tr><td><b>A</b> (auto reset)</td><td>Flash + horn → ACK → steady → clears by itself when condition returns to normal.</td></tr><tr><td><b>M</b> (manual reset)</td><td>Same, but after the condition returns, window stays on until RESET is pressed.</td></tr><tr><td><b>R</b> (ringback)</td><td>When the condition clears, window slow-flashes and a different tone sounds, so the operator knows it cleared. RESET to go dark.</td></tr><tr><td><b>F3A</b> (first-out)</td><td>Of a group, the <i>first</i> alarm flashes differently so you know what started a cascade.</td></tr></table>
<h3>Building one in an SEL relay</h3><p>Per window (here sequence M), with input <code>IN201</code>, ACK on <code>PB01</code>, RESET on <code>PB02</code>:</p><pre>SET11 := R_TRIG IN201                   (alert latch)
RST11 := R_TRIG PB01                    (ack clears alert)
SET12 := R_TRIG IN201                   (in-alarm latch)
RST12 := R_TRIG PB02 * !IN201           (reset only if clear)
LED   := LT11 * FLASH + !LT11 * LT12    (flash, then steady)
HORN  := LT11 (OR'd across all windows)</pre><p><code>FLASH</code> can be a free-running SV oscillator: <code>SV10 := !SV10T</code> with PU/DO 30 cycles.</p>
<h3>Lamp test</h3><p>A pushbutton that forces every LED on. Required on most panels: operators test before trusting a dark window.</p>
<h3>Fail-safe field inputs</h3><p>Wire alarm contacts to be closed when healthy. A cut wire then alarms instead of hiding.</p>`,labs:['rec'],
quiz:[{q:'Sequence where the window stays on until RESET after clearing:',o:['A','M','R','F3A'],a:1,why:'Manual reset.'},
{q:'Ringback tells the operator…',o:['A new alarm','The condition has cleared','Lamp test','Power lost'],a:1,why:'Distinct return-to-normal indication.'},
{q:'First-out sequences help…',o:['Silence horns','Find what started a cascade','Save power','Test lamps'],a:1,why:'First alarm is marked.'}]},
{id:'pi2',phase:P,title:'Panel wiring practice: terminals, labels, shorting blocks',body:`
<h3>Terminal blocks</h3><ul><li>All field wiring lands on terminal blocks, never directly on the relay. The relay can then be swapped without touching field wires.</li><li><b>CT circuits</b> land on <b>shorting terminal blocks</b> (with shorting screws or bars), so you can short a CT before opening anything.</li><li>One wire per side of a terminal unless it's rated for two. Use ferrules or ring lugs per spec; ring lugs on CT circuits (they can't slip off).</li></ul>
<h3>Wire markers</h3><p>Every wire end labelled with its destination ("from-to"): e.g. <code>TB1-5 / R1-Z01</code>. This is what lets you trace a circuit at 2 a.m.</p>
<h3>Wire sizes and colours (typical)</h3><ul><li>CT circuits: #10 or #12 AWG (low burden, mechanical strength).</li><li>PT and DC control: #14 AWG.</li><li>Colour schemes vary by utility: follow the spec, not habit.</li></ul>
<h3>Grounding</h3><ul><li>Each CT circuit grounded at <b>one point only</b>, normally at the first panel. Two grounds create a parallel path and wrong currents.</li><li>PT secondaries grounded at one point.</li><li>Relay chassis ground to panel ground bar.</li></ul>
<h3>Segregation</h3><p>Keep AC (CT/PT) and DC wiring in separate bundles where practical; keep trip circuits from different DC sources separate. Redundant (A/B) systems must not share fuses, wires, or terminal blocks.</p>
<h3>Point-to-point check</h3><p>Before energizing a new panel: ring out every wire against the wiring diagram, megger CT/PT circuits, verify every terminal is tight (torque), and check every label.</p>`,labs:[],
quiz:[{q:'A CT circuit should be grounded at…',o:['Every panel','One point only','Never','Both ends'],a:1,why:'Multiple grounds = parallel paths.'},
{q:'Why do field wires land on terminal blocks, not the relay?',o:['Cheaper','Relay can be replaced without disturbing field wiring','Faster','Code'],a:1,why:'Maintainability and safety.'},
{q:'Preferred termination for CT wires:',o:['Bare wire','Ring lugs','Spade with no lock','Twist'],a:1,why:'Can\'t slip off and open the CT.'}]},
{id:'pi3',phase:P,title:'86 lockout relays and trip paths',body:`
<p>An <b>86 lockout relay</b> is a hand-reset multi-contact relay. When energized it latches mechanically, opens/blocks every breaker it's wired to, and stays tripped until someone physically resets the handle.</p>
<h3>Why use one</h3><ul><li>Transformer and bus faults: you never want an automatic or remote close before someone inspects.</li><li>One relay output trips many breakers (the 86 has 10–20 contacts).</li><li>Blocks closing: an 86 contact sits in series with each breaker's close circuit.</li></ul>
<h3>Typical wiring</h3><ul><li>Relay output (e.g. <code>OUT101 := TRIP</code> from 87T) → 86 coil.</li><li>86 contacts → trip coils of HV and LV breakers (parallel with other trip paths).</li><li>86 "b" contacts in series with close circuits.</li><li>86 position contact → relay input (e.g. <code>IN106</code>) for SER, annunciation and <code>79DTL</code>.</li></ul>
<h3>Coil monitoring</h3><p>86 coils are high-current; a monitoring circuit (a small current through the coil via the relay input, or a dedicated monitor) proves the coil is intact. Alarm on loss.</p>
<h3>Electrically reset vs hand reset</h3><p>Some 86s have an electrical reset coil. Utility practice decides whether remote reset is allowed; usually not for transformer lockouts.</p>
<h3>Testing</h3><ol><li>Isolate breaker trip paths (or ensure breakers are open/tested).</li><li>Operate the relay output; confirm the 86 trips and every contact changes.</li><li>Check each breaker trips and that close is blocked.</li><li>Reset; verify all contacts restored.</li></ol>`,labs:[],
quiz:[{q:'86 lockout resets…',o:['Automatically','By hand (usually)','After 79 shot','On power cycle'],a:1,why:'Forces inspection.'},
{q:'86 blocks closing by…',o:['Software only','A contact in series with close circuits','Opening CTs','Removing DC'],a:1,why:'Physical interlock.'},
{q:'Why wire 86 position to a relay input?',o:['Trip faster','SER/annunciation and drive 79 to lockout','Measure current','Power the relay'],a:1,why:'Visibility and logic.'}]},
{id:'pi4',phase:P,title:'Arc-flash detection on the 751',body:`
<p>An arc flash in switchgear releases enormous energy; injury severity grows with clearing time. Normal overcurrent waits for coordination. <b>Arc-flash detection</b> trips in a few milliseconds.</p>
<h3>How the 751 does it</h3><ul><li><b>Light sensors</b>: point sensors or bare-fiber loop sensors in the cubicles, connected to the 751's arc-flash inputs.</li><li><b>Overcurrent supervision</b>: fast 50 elements (<code>50PAF</code>, <code>50NAF</code>) confirm it's a real arc, not a camera flash or sunlight.</li><li><b>Trip</b> = light AND overcurrent: <code>TOL1 * 50PAF</code> → high-speed output. Total relay time ≈ 2–3 ms with fast hybrid outputs.</li></ul>
<h3>Settings to know</h3><ul><li>Light pickup level (<code>TOL1P</code>…), sensor type, fiber self-test.</li><li><code>50PAFP</code>: above max load and motor starting, below minimum arcing current (arcing current is lower than bolted fault current: often 50–80%).</li></ul>
<h3>Maintenance mode</h3><p>A "maintenance switch" (selector or pushbutton latch) that lowers 50 pickups/removes delays while workers are inside the gear. Annunciate it brightly. Turn it off afterwards.</p>
<h3>Testing</h3><ul><li>Use a strong flashlight/flash on each sensor: light bit asserts, no trip without current.</li><li>Inject current above <code>50PAFP</code>: no trip without light.</li><li>Both together: time the trip output.</li><li>Check the sensor self-supervision alarm by unplugging a sensor.</li></ul>`,labs:[],
quiz:[{q:'Arc-flash trip requires…',o:['Light only','Current only','Light AND overcurrent','Neither'],a:2,why:'Supervision avoids false trips.'},
{q:'Arcing current vs bolted fault current:',o:['Higher','Lower (often 50–80%)','Same','Zero'],a:1,why:'Arc resistance limits it.'},
{q:'Maintenance mode does what?',o:['Disables protection','Speeds tripping while people work','Blocks alarms','Changes CTR'],a:1,why:'Lower energy exposure.'}]}]);

{id:'sw1',phase:P,title:'QuickSet in depth: device manager, templates, firmware',body:`
<h3>Device manager</h3><p>Keep one QuickSet database per site. Each relay gets an entry with its part number, connection (serial or Ethernet) and settings history. Always <b>read from the relay first</b> before editing, so you start from what is really in service.</p>
<h3>Part number matters</h3><p>The part number sets which inputs, outputs and features exist. A settings file built for a different part number may refuse to load or hide settings. Check it on the relay label and with <code>ID</code>.</p>
<h3>Templates</h3><ul><li>A template locks the settings a technician should not touch and exposes only a few (CTR, pickups).</li><li>Use one for many identical feeders: fewer typing errors, consistent logic.</li></ul>
<h3>Compare</h3><p>Before sending, use <b>Compare</b> between the relay's settings and your file. Every difference should be one you intended.</p>
<h3>Firmware upgrade</h3><ol><li>Read and save all settings and event reports.</li><li>Check the firmware release notes and compatibility with your QuickSet driver.</li><li>Take the relay out of service (block trips).</li><li>Load firmware; the relay restarts.</li><li>Verify <code>ID</code> shows the new version, settings are intact, and run a functional check.</li></ol>`,labs:[],
quiz:[{q:'First step before editing a relay in service:',o:['Send defaults','Read its settings','Upgrade firmware','Reset passwords'],a:1,why:'Start from what is really there.'},
{q:'Templates help mostly by…',o:['Speed of trips','Limiting what can be changed','Adding outputs','Encrypting'],a:1,why:'Fewer errors.'},
{q:'Before a firmware upgrade, save…',o:['Nothing','Settings and events','Only passwords'],a:1,why:'They may be lost.'}]},
{id:'sw2',phase:P,title:'Settings management and checksums',body:`
<p>A protection setting is only trustworthy if you can prove what is in the relay matches the approved file.</p>
<h3>Version control</h3><ul><li>Name files with site, device, date and revision: <code>SUB1_F3_751_2026-11-18_r3.rdb</code>.</li><li>Keep an "as-left" copy after every commissioning or change.</li><li>Record who changed what and why.</li></ul>
<h3>Checksums and settings change alarms</h3><ul><li>The relay keeps a settings change bit (e.g. <code>SALARM</code>) and logs settings changes in the SER.</li><li>Comparing the relay's settings report against the approved file is the real proof; some tools compute a checksum to make this quick.</li><li>Map the settings change alarm to SCADA so unexpected changes are seen.</li></ul>
<h3>Approval workflow</h3><p>Engineer issues → reviewer checks → technician loads → technician sends back as-left → engineer compares. Nothing goes in service without the compare.</p>`,labs:[],
quiz:[{q:'Proof that the relay matches the approved file:',o:['Memory','A compare against the as-left file','Front panel LEDs'],a:1,why:'Compare every setting.'},
{q:'Unexpected settings changes should…',o:['Be ignored','Alarm to SCADA','Reboot the relay'],a:1,why:'Visibility.'}]}]);

{id:'sw3',phase:C,title:'IEC 61850 in detail',body:`
<h3>The model</h3><p>A relay is a <b>Logical Device</b> containing <b>Logical Nodes</b> (LNs) with standard names: <code>PTOC</code> (time overcurrent), <code>PIOC</code> (instantaneous), <code>XCBR</code> (breaker), <code>CSWI</code> (switch control), <code>MMXU</code> (measurements). Data inside is addressed like <code>F3/PTOC1.Op.general</code>.</p>
<h3>Three services</h3><ul><li><b>MMS</b>: client/server, for SCADA reads and controls.</li><li><b>GOOSE</b>: fast multicast messages between relays (trip, block, breaker status), a few ms, repeated constantly so loss is detected.</li><li><b>Sampled values</b>: digitized CT/PT signals from merging units (process bus).</li></ul>
<h3>Files</h3><ul><li><b>ICD</b>: what a device can do (from the vendor).</li><li><b>SCD</b>: the whole substation, built by a system tool.</li><li><b>CID</b>: the configured file loaded into one relay.</li></ul>
<h3>Architect workflow</h3><ol><li>Add each relay's ICD.</li><li>Build datasets (what each GOOSE publishes).</li><li>Create GOOSE publications; subscribe other relays and map incoming bits to virtual bits (e.g. <code>VB001</code>).</li><li>Export CID files and send to relays.</li><li>Use those virtual bits in SELogic: <code>TR := ... + VB001</code>.</li></ol>
<h3>Quality and testing</h3><p>Every GOOSE has a quality and a time-to-live. Supervise lost messages (a "message quality" bit) and alarm. Test with a GOOSE sniffer (Wireshark) and by checking the subscribed bit changes.</p>`,labs:[],
quiz:[{q:'Fast relay-to-relay trip/block messages:',o:['MMS','GOOSE','DNP3','Modbus'],a:1,why:'Multicast, few ms.'},
{q:'File loaded into one relay:',o:['ICD','SCD','CID'],a:2,why:'Configured IED description.'},
{q:'Logical node for a breaker:',o:['PTOC','XCBR','MMXU'],a:1,why:'X = switchgear.'}]},
{id:'sw4',phase:C,title:'RTAC basics',body:`
<p>The SEL <b>RTAC</b> is a substation automation controller. It collects data from relays and talks to the control centre.</p>
<h3>What it does</h3><ul><li>Polls relays (SEL protocol, DNP3, Modbus, 61850 MMS) and acts as a DNP3 server to SCADA.</li><li>Runs logic in IEC 61131-3 (structured text, function blocks), for schemes bigger than one relay.</li><li>Time sync, event collection, user access logging.</li></ul>
<h3>Configuration (AcSELerator RTAC)</h3><ol><li>Add devices (each relay with its protocol and address).</li><li>Map points: relay bits and analogs into tags.</li><li>Build the DNP3 server point list for SCADA.</li><li>Add logic if needed; compile; send to RTAC.</li><li>Check communication diagnostics: each device should show online with no errors.</li></ol>
<h3>Point list discipline</h3><p>The SCADA point list is a contract with the control centre. Changing an index breaks their display. Version and agree it.</p>`,labs:[],
quiz:[{q:'RTAC usually serves SCADA via…',o:['GOOSE','DNP3','Sampled values'],a:1,why:'Utility standard.'},
{q:'RTAC logic language:',o:['SELogic','IEC 61131-3','Python'],a:1,why:'Structured text, function blocks.'}]},
{id:'sw5',phase:C,title:'Cybersecurity for relays',body:`
<h3>Basics that stop most problems</h3><ul><li><b>Change default passwords</b> at every access level (ACC, 2AC, etc.). Record them in the utility's password vault.</li><li>Disable unused ports and protocols (Telnet, FTP, unused Ethernet ports).</li><li>Use role-based access: technicians at level 2, engineers where needed.</li></ul>
<h3>Network</h3><ul><li>Relays sit behind a firewall/security gateway; no direct internet path.</li><li>Separate networks (VLANs) for protection GOOSE, SCADA and engineering access.</li><li>Remote engineering access through a jump host with logging.</li></ul>
<h3>Monitoring</h3><p>Map login alarms, settings changes and failed passwords to SCADA/syslog. An unexplained settings change is a security event until proven otherwise.</p>
<h3>Rules</h3><p>In North America, NERC CIP applies to many substations: access control, change management, logging, patching. Follow your utility's procedures exactly.</p>
<h3>Laptops and USB</h3><p>Use a dedicated, scanned engineering laptop. Never plug unknown USB drives into the substation network.</p>`,labs:[],
quiz:[{q:'First and most important step:',o:['Add VLANs','Change default passwords','Install antivirus on the relay'],a:1,why:'Defaults are public.'},
