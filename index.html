*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.65 var(--sans)}

main{padding:40px 48px 80px;display:flex;flex-direction:column;gap:24px;max-width:900px;width:100%}

.note{background:var(--accbg);border:1px solid var(--acc);border-width:0 0 0 4px;padding:14px 18px;border-radius:8px}
.lab,.quiz{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px #0000000d}
.lab h3,.quiz h3{margin:0;font-size:18px}

.quiz h3::before{content:"";color:var(--acc);font-size:12px;letter-spacing:.1em}

input,select,textarea{font:15px var(--mono);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);min-width:0}

textarea{width:100%;resize:vertical}
.btn{background:var(--fg);color:var(--bg);border:0;padding:9px 18px;border-radius:8px;font:600 15px var(--sans);cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500;font-size:14px;padding:7px 12px}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.out{font:15px/1.6 var(--mono);white-space:pre-wrap;background:var(--code);color:var(--codefg);padding:14px 16px;border-radius:8px}
#selbits label{flex-direction:row;align-items:center;gap:6px;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font:14px var(--mono);cursor:pointer}
.q{border-top:1px solid var(--line);padding-top:14px}
.q p{margin:0 0 10px;font-weight:600}

.opt:hover{border-color:var(--acc)}

.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.btn.reset{background:none;border:1px solid var(--line);color:var(--mut);font-size:13px;padding:4px 10px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px}.card h3{margin:6px 0 4px}.card .btn{margin-top:12px}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}.how div{display:flex;flex-direction:column;gap:4px}.how span{font-size:14px;color:var(--mut);line-height:1.5}
.syl{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:32px 1fr auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 18px;font:15px var(--sans);color:var(--fg);cursor:pointer}.srow:last-child{border-bottom:0}.srow:hover{background:var(--bg)}.srow>span:nth-child(2){display:flex;flex-direction:column;gap:2px}.srow .why{font-size:13.5px}

#lbody{display:flex;flex-direction:column;gap:24px}
.keys{background:var(--okbg);border:1px solid var(--ok);border-radius:12px;padding:18px 22px}.keys .eyebrow{color:var(--ok)}.keys ul{margin:8px 0;padding-left:20px}
.flash{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 10px #0000000a}
.ff{font-size:21px;font-weight:600;line-height:1.4}.fk{font-size:17px;border-top:1px solid var(--line);padding-top:14px;margin-bottom:12px}
.btn small{display:block;font-size:11px;opacity:.7;font-weight:500}
.grades .btn{flex:1}.g0{background:var(--bad)!important}.g1{background:var(--mut)!important}.g2{background:var(--ok)!important}.g3{background:var(--acc)!important}
.pbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
.pill{font-size:12px;font-weight:600;background:var(--accbg);color:var(--acc);border-radius:20px;padding:3px 10px}
.case-head{display:flex;flex-direction:column;gap:6px}.case-head b{font-size:19px}
#caselist{flex-direction:column;align-items:stretch;gap:6px}#caselist .btn{text-align:left}.btn.ghost.on{border-color:var(--acc);color:var(--acc);background:var(--accbg)}
@media (max-width:860px){.hero,.grid2,.how{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,auto)}#tabs .tab{padding:0 8px;font-size:14px}#brand span{display:none}header{gap:10px;padding:0 12px}}
.tgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}.tscreen{background:var(--code);border-radius:10px;padding:12px 14px;font:14px/1.5 var(--mono);color:#cfe3d0}#tout{background:none;margin:0;padding:0;height:330px;overflow-y:auto;white-space:pre-wrap;color:inherit;font:inherit}.tin{display:flex;gap:6px;align-items:center;border-top:1px solid #ffffff22;padding-top:8px}.tin input{flex:1;background:none;border:0;color:#fff;font:inherit;padding:2px}.tin input:focus{outline:0}
.tset{margin-top:12px;align-items:center}.ck{flex-direction:row;align-items:center;gap:6px;color:var(--fg)}.job{padding-left:20px;margin:8px 0 14px;display:flex;flex-direction:column;gap:10px}.job li{color:var(--mut)}.job li b{display:block;font-weight:600}.job li.ok{color:var(--ok)}.job li.ok b::after{content:" ✓"}.job li.cur{color:var(--fg)}.job li.cur b{color:var(--acc)}.job li span{display:block;font-size:14.5px;margin-top:4px}
@media (max-width:860px){.tgrid{grid-template-columns:1fr}}
.keys2{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:middle}.job kbd{cursor:pointer}.job kbd:hover{border-color:var(--acc);color:var(--acc)}.job .now{color:var(--mut);font-family:var(--mono);font-size:13px}kbd{font:13px var(--mono);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg)}

.predict .btn{align-self:flex-start}
.ff{font-size:22px;font-weight:650;line-height:1.4;margin-bottom:6px}
.lp-body .opt{counter-increment:opt;display:flex;align-items:center;gap:14px;background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh1);transition:border-color .15s,transform .12s var(--ease),background .15s;font-size:16px}
.lp-body .opt::before{content:counter(opt);flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:600 13px var(--sans);color:var(--mut);border:1.5px solid var(--line);background:var(--bg)}
.lp-body .sg .opt::before{display:none}.lp-body .sg .opt{justify-content:center}
.lp-body .opt:hover{border-color:var(--acc);transform:translateY(-1px)}
.lp-body .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--fg)}.lp-body .opt.right::before{content:"✓";background:var(--ok);border-color:var(--ok);color:#fff}
.lp-body .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--fg);animation:shake .35s}.lp-body .opt.wrong::before{content:"✕";background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.expl{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px;box-shadow:var(--sh1);animation:rise .3s var(--ease) both}
.expl p{margin:6px 0}
.keys{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh2);border-radius:18px;padding:22px 26px}
.lp-foot{background:var(--top);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .25s;display:block}
.lp-foot .inner{max-width:780px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}

.lp-foot.good{background:var(--okbg);border-top-color:var(--ok)}.lp-foot.good .msg{display:flex;color:var(--ok)}
.lp-foot.bad{background:var(--badbg);border-top-color:var(--bad)}.lp-foot.bad .msg{display:flex;color:var(--bad)}

@media (max-width:860px){main{padding:20px 16px 96px}.lp-body h2{font-size:27px}.predict p,.ff{font-size:19px}.hint{display:none}.lp-where span:nth-child(2){flex-basis:100%;order:3}}

.flow{stroke-dasharray:10 10;animation:dash 1s linear infinite}.flow.rev{animation-direction:reverse}@keyframes dash{to{stroke-dashoffset:-20}}.grow{transform-box:fill-box;transform-origin:left;animation:grow .7s ease both}@keyframes grow{from{transform:scaleX(0)}}.viz svg{width:100%;height:auto}</style></head><body>

window.LESSONS=[
{id:'map',phase:'Orientation',title:'How a protection panel works',body:`
<p>A protection and control (P&amp;C) panel turns measured secondary quantities into decisions. Every scheme you will build follows the same chain:</p>
<pre>CTs / PTs → relay analog inputs → protection elements → SELogic → output contacts → trip coils, lockouts, annunciator windows
                         ↑                                    ↑
           breaker status, pushbuttons, Mirrored Bits (contact / comms inputs)</pre>
<h3>The three relays in this course</h3>
<div class="tbl"><table><tr><th>Relay</th><th>Job</th><th>Core elements</th></tr>
<tr><td>SEL-351S</td><td>Distribution feeder / directional overcurrent with reclosing</td><td>50, 51, 67 / 32, 79, 27 / 59, 81, synch check</td></tr>
<tr><td>SEL-751</td><td>Feeder protection, distribution automation, optional arc-flash</td><td>50 / 51, 27 / 59, 81, arc-flash (light + current), Mirrored Bits</td></tr>
<tr><td>SEL-787</td><td>Two-winding transformer differential</td><td>87R / 87U, harmonic blocking / restraint, REF, 50 / 51 per winding</td></tr></table></div>
<h3>What “expert” means here</h3>
<ul><li>You can read a one-line and relay schedule and produce settings without a template.</li>
<li>You can trace any lit annunciator window back through wire, terminal, output contact, equation and element.</li>
<li>You can prove every setting with a test set and explain every event report.</li></ul>
<p class="note">Use the manual for your exact firmware as the final word. Bit names and setting ranges change between versions; this course teaches the patterns.</p>`,
quiz:[{q:'Where does a SELogic equation sit in the chain?',o:['Between CTs and analog inputs','Between protection elements and output contacts','Inside the annunciator','Between the breaker and its trip coil'],a:1,why:'Elements assert Relay Word bits; SELogic combines them and drives outputs.'},
{q:'Which relay in this course provides transformer differential protection?',o:['SEL-351S','SEL-751','SEL-787'],a:2,why:'The 787 is the transformer protection relay (87R / 87U).'}]},

{id:'quickset',phase:'Phase 1 · Foundation',title:'QuickSet and the terminal',body:`
<p><b>acSELerator QuickSet (SEL-5030)</b> is the settings editor. Settings for each relay live in a QuickSet database file (<code>.rdb</code>). Install the device drivers for each relay model and firmware you will touch.</p>
<h3>Daily workflow</h3>
<ol><li><b>Create offline</b>: New → pick model, part number and firmware. The part number decides which options (arc-flash, I/O cards) exist.</li>
<li><b>Edit</b> by settings class: Global, Group 1–6, Logic, Port, Report, Front Panel.</li>
<li><b>Read</b> from the relay before changing anything, and save that as the as-found file.</li>
<li><b>Send</b> only the classes you changed. The relay may briefly disable protection while it saves; know which classes do that on your model.</li>
<li>Save as-left file and print settings for the record.</li></ol>
<h3>Learn the ASCII terminal too</h3>
<div class="tbl"><table><tr><th>Command</th><th>Use</th></tr>
<tr><td><code>ACC</code> / <code>2AC</code></td><td>Enter access level 1 (view) / level 2 (change settings)</td></tr>
<tr><td><code>SHO</code> / <code>SHO L</code></td><td>Show settings / logic settings</td></tr>
<tr><td><code>TAR bitname</code></td><td>Put a Relay Word bit row on the front LEDs / watch it</td></tr>
<tr><td><code>MET</code>, <code>MET DIF</code></td><td>Metering; differential metering on the 787</td></tr>
<tr><td><code>HIS</code>, <code>EVE n</code>, <code>CEV n</code></td><td>Event history, event report, compressed event</td></tr>
<tr><td><code>SER</code></td><td>Sequential events recorder</td></tr>
<tr><td><code>PUL OUTnnn</code></td><td>Pulse an output contact (for trip checks)</td></tr></table></div>
<p class="note">Habit: version every .rdb (date + as-found / as-left) and compare before each send. QuickSet has a settings compare tool.</p>
<h3>Courses to take</h3><p>SEL University offers free online modules on QuickSet and on reading SELogic, plus instructor-led protection courses. Check the current catalogue for exact names; course codes change.</p>`,
quiz:[{q:'What should you do before changing settings on an in-service relay?',o:['Send the new file immediately','Read the relay and save an as-found file','Reset the relay to defaults','Delete old events'],a:1,why:'The as-found file is your rollback and your record.'},
{q:'Which command lets you watch a specific bit live?',o:['MET','TAR','HIS','SER'],a:1,why:'TAR targets a Relay Word bit row so you can see it change.'},
{q:'What decides whether arc-flash settings appear for a 751?',o:['Firmware date','Its part number / ordering options','Group number','Port settings'],a:1,why:'Options are hardware and ordered; QuickSet builds the settings tree from the part number.'}]},

{id:'bits',phase:'Phase 2 · SELogic',title:'Relay Word bits',body:`
<p>Everything inside an SEL relay that is true or false is a <b>Relay Word bit</b>. The relay evaluates all of them every processing interval (a fraction of a cycle). Equations define new bits from existing ones.</p>
<div class="tbl"><table><tr><th>Family</th><th>Examples</th><th>Meaning</th></tr>
<tr><td>Inputs</td><td><code>IN101</code>, <code>IN102</code></td><td>Contact input energized</td></tr>
<tr><td>Element pickup</td><td><code>50P1</code>, <code>51P</code>, <code>51G</code></td><td>Element above pickup</td></tr>
<tr><td>Element timed out</td><td><code>51PT</code>, <code>51GT</code>, <code>67P1T</code></td><td>Time-delay expired: use these for tripping</td></tr>
<tr><td>Trip logic</td><td><code>TRIP</code> (351S), <code>TRIP1</code> (787)</td><td>Result of TR equation plus seal-in and unlatch logic</td></tr>
<tr><td>Variables / timers</td><td><code>SV01</code>, <code>SV01T</code>, <code>PSV01</code></td><td>Scratch logic; SV timers have pickup and dropout delays</td></tr>
<tr><td>Latches</td><td><code>LT01</code> via <code>SET01</code> / <code>RST01</code></td><td>Retained through power loss</td></tr>
<tr><td>Comms</td><td><code>RMB1A</code>, <code>TMB1A</code></td><td>Mirrored Bits received / transmitted</td></tr>
<tr><td>Outputs</td><td><code>OUT101</code></td><td>Output contact state</td></tr></table></div>
<h3>Pickup vs timed-out</h3>
<p><code>51P</code> means the current is above pickup and the curve is timing. <code>51PT</code> means the curve has expired. Trip on <code>51PT</code>; alarm or supervise on <code>51P</code>. Confusing the two is the most common beginner error.</p>
<h3>TR vs TRIP</h3>
<p>You write <code>TR</code> (the trip conditions). The relay produces <code>TRIP</code>, which seals in for a minimum time (TDURD) and stays until unlatch conditions (ULTR) are met. Drive the trip contact from <code>TRIP</code>, not directly from elements.</p>`,
quiz:[{q:'Which bit should trip the breaker for a time-overcurrent fault?',o:['51P','51PT','50P1 only','IN101'],a:1,why:'51PT asserts when the curve times out; 51P is only pickup.'},
{q:'What drives the trip output contact in a standard 351S scheme?',o:['TR','TRIP','ULTR','52A'],a:1,why:'TRIP includes minimum trip duration and unlatch logic.'},
{q:'What makes latch bits useful for annunciation?',o:['They are faster','They survive a relay power cycle','They can only be set by inputs','They pulse'],a:1,why:'Latch states are kept in nonvolatile memory.'}]},

{id:'syntax',phase:'Phase 2 · SELogic',title:'Equation syntax',body:`
<p>SEL relays do not use ladder logic. Each programmable item is a Boolean equation. Two syntaxes exist:</p>
<div class="tbl"><table><tr><th>Function</th><th>351S (classic SELogic)</th><th>751 / 787 (newer)</th></tr>
<tr><td>AND</td><td><code>*</code></td><td><code>AND</code></td></tr><tr><td>OR</td><td><code>+</code></td><td><code>OR</code></td></tr>
<tr><td>NOT</td><td><code>!</code></td><td><code>NOT</code></td></tr><tr><td>Rising edge</td><td><code>/IN101</code></td><td><code>R_TRIG IN101</code></td></tr>
<tr><td>Falling edge</td><td><code>\\IN101</code></td><td><code>F_TRIG IN101</code></td></tr><tr><td>Grouping</td><td><code>( )</code></td><td><code>( )</code></td></tr></table></div>
<p class="note"><code>&amp;</code> is not an SEL operator. Precedence is NOT, then AND, then OR. Use parentheses anyway so the next engineer can read it.</p>
<h3>Patterns to know cold</h3>
<pre>TR     = 50P1 + 51PT + 51GT                  ← 351S feeder trip
SV01   = 51G * !51GT                         ← ground pickup, not yet tripped (timer SV01PU/DO)
OUT103 = SV01T + LT02                        ← annunciator: ground alarm or latched event
TR1    = 87R OR 87U OR 50P11T                ← 787 trip
CL     = IN103 * !TRIP * 52B                 ← supervised manual close (351S)</pre>
<p>The 751 and 787 also allow free-form protection and automation logic with math, comparisons, counters and timers. Learn the basic equations first.</p>`,
labs:['selogic'],
quiz:[{q:'In a 351S, how do you write “IN101 and not 52A”?',o:['IN101 & !52A','IN101 * !52A','IN101 AND NOT 52A','IN101 + !52A'],a:1,why:'Classic SELogic uses * for AND and ! for NOT.'},
{q:'Evaluate A + B * !C with A=0, B=1, C=1.',o:['0','1'],a:0,why:'AND binds first: B * !C = 1 * 0 = 0, then 0 + 0 = 0.'},
{q:'Which operator detects an input changing from 0 to 1 on a 787?',o:['F_TRIG','R_TRIG','NOT','/'],a:1,why:'R_TRIG is the newer syntax for the rising edge; / is the 351S form.'}]},

{id:'timers',phase:'Phase 2 · SELogic',title:'Timers, latches, and seal-in',body:`
<p>Three building blocks cover most panel logic.</p>
<h3>1. SELogic variable timers</h3>
<p><code>SV01</code> is the input; <code>SV01PU</code> and <code>SV01DO</code> set pickup and dropout delay (cycles on the 351S); <code>SV01T</code> is the timed output. Use them for alarm delays, breaker-failure style timing and debounce.</p>
<pre>SV02   = 52A * !IN104        ← breaker closed but spring not charged
SV02PU = 600                 ← 10 s at 60 Hz before alarming
OUT104 = SV02T               ← annunciator "Spring not charged"</pre>
<h3>2. Latch bits</h3>
<pre>SET01 = /TRIP                ← set on the rising edge of a trip
RST01 = IN102 * !TRIP        ← panel reset PB, only when trip has cleared
OUT103 = LT01</pre>
<p>Reset wins? Check the manual for which input dominates when SET and RST are both true on your model, and design so that never happens.</p>
<h3>3. Seal-in with a self term</h3>
<p>An equation can reference its own output to hold itself: <code>SV03 = IN105 + SV03 * !IN102</code>. This is lighter than a latch but does not survive power loss.</p>
<h3>Debounce inputs</h3>
<p>Every contact input has its own pickup and dropout debounce settings. Set them before blaming logic for chatter.</p>`,
labs:['selogic'],
quiz:[{q:'You want an alarm only if a condition persists for 5 s. What do you use?',o:['A latch bit','An SV timer with pickup delay','R_TRIG','A Mirrored Bit'],a:1,why:'SVnnPU delays assertion of SVnnT.'},
{q:'Why add “* !TRIP” to the reset equation?',o:['To make it faster','So the operator cannot clear the window while the trip is still present','It is required syntax','To avoid using an input'],a:1,why:'Reset only takes effect after the condition clears.'}]}
];
window.LESSONS.push(
{id:'oc',phase:'Phase 3 · Relay profiles',title:'Overcurrent fundamentals (50/51)',body:`
<p><b>50</b> is instantaneous (or definite-time) overcurrent. <b>51</b> is inverse-time: the higher the current, the faster it trips. P = phase, G = residual ground (3I0), N = neutral CT input, Q = negative sequence (3I2).</p>
<h3>Setting a 51</h3><ol><li><b>Pickup</b>: above maximum load (phase) or maximum unbalance (ground), below minimum fault at the end of the zone.</li>
<li><b>Curve</b>: match the devices you coordinate with. Very or extremely inverse coordinates well with fuses.</li>
<li><b>Time dial</b>: gives a coordination time interval (typically 0.2–0.4 s) over the downstream device at the maximum through-fault.</li></ol>
<h3>SEL curve equations (351S / 751)</h3>
<pre>U1 moderately inverse   t = TD × (0.0226  + 0.0104  / (M^0.02 − 1))
U2 inverse              t = TD × (0.180   + 5.95    / (M² − 1))
U3 very inverse         t = TD × (0.0963  + 3.88    / (M² − 1))
U4 extremely inverse    t = TD × (0.02434 + 5.64    / (M² − 1))
C1 IEC standard inverse t = TD × 0.14 / (M^0.02 − 1)
M = measured current / pickup</pre>
<p>Settings are in secondary amperes. Primary = secondary × CT ratio. Always check which you are reading.</p>
<p class="note">Many SEL 51 elements also have electromechanical reset emulation (51RS). It changes timing for repeated faults during reclosing.</p>`,
labs:['curve'],
quiz:[{q:'A 51P has pickup 5 A secondary, CT 600:5. Primary pickup?',o:['5 A','120 A','600 A','3000 A'],a:2,why:'CTR = 120; 5 × 120 = 600 A primary.'},
{q:'U3, TD 2, M = 5. Operate time is closest to:',o:['0.52 s','0.36 s','7.8 s','1.0 s'],a:0,why:'3.88 / (25 − 1) = 0.1617; + 0.0963 = 0.258; × 2 = 0.516 s.'},
{q:'Which current does a 51G residual element measure?',o:['Phase A only','3I0 from the three phase CTs','Negative sequence','Neutral PT voltage'],a:1,why:'Residual ground = Ia + Ib + Ic = 3I0.'}]},

{id:'351',phase:'Phase 3 · Relay profiles',title:'SEL-351S: directional + reclosing',body:`
<h3>Directional control (67 / 32)</h3>
<p>SEL directional elements are referenced to the <b>line impedance angles</b> <code>Z1ANG</code> (positive sequence) and <code>Z0ANG</code> (zero sequence), rather than a single “relay characteristic angle”. Enter line impedances and the relay builds the maximum-torque angle.</p>
<ul><li><code>ORDER</code>: priority of ground directional methods. Q = negative-sequence voltage-polarized, V = zero-sequence voltage-polarized, I = current-polarized (needs a ground source CT).</li>
<li>Forward / reverse thresholds (<code>Z2F</code>, <code>Z2R</code>, <code>Z0F</code>, <code>Z0R</code>) are often auto-set: let the relay calculate them until you understand them.</li>
<li>Directional bits like <code>32GF</code> / <code>32QF</code> torque-control the overcurrent elements (<code>67P1TC</code>, <code>51GTC</code> equations).</li></ul>
<h3>Reclosing (79)</h3>
<div class="tbl"><table><tr><th>Setting</th><th>Meaning</th></tr>
<tr><td><code>79OI1…79OI4</code></td><td>Open intervals before each reclose shot</td></tr>
<tr><td><code>79RSD</code></td><td>Reset time from reclose cycle (successful reclose)</td></tr>
<tr><td><code>79RSLD</code></td><td>Reset time from lockout (after manual close)</td></tr>
<tr><td><code>79RIS</code></td><td>Reclose initiate supervision</td></tr>
<tr><td><code>79DTL</code></td><td>Drive-to-lockout (e.g. hot-line tag, recloser switched off)</td></tr>
<tr><td><code>79SKP</code></td><td>Skip a shot</td></tr>
<tr><td><code>79CLS</code></td><td>Close supervision (e.g. synch check, dead line)</td></tr></table></div>
<p>Shot counter bits <code>SH0…SH4</code> let you change protection by shot. Classic fuse-saving:</p>
<pre>50P1TC = SH0            ← fast instantaneous only before the first reclose
TR     = 50P1 + 51PT + 51GT
79DTL  = !IN106         ← reclosing off switch</pre>`,
quiz:[{q:'On a 351S, what angle settings drive directional element characteristics?',o:['Z1ANG and Z0ANG','CTR and PTR','TDURD','79OI1'],a:0,why:'SEL uses line impedance angles rather than a stand-alone RCA.'},
{q:'Which equation sends the recloser straight to lockout?',o:['79RIS','79DTL','79CLS','79SKP'],a:1,why:'79DTL = drive to lockout.'},
{q:'What does 50P1TC = SH0 accomplish?',o:['Blocks 50P1 forever','Allows 50P1 only before the first reclose (fuse saving)','Delays 50P1','Makes 50P1 directional'],a:1,why:'SH0 is true only at shot 0.'}]},

{id:'751',phase:'Phase 3 · Relay profiles',title:'SEL-751: arc-flash + Mirrored Bits',body:`
<p>The 751 covers the same feeder overcurrent family as the 351S using the newer SELogic syntax, with voltage, frequency, breaker monitoring and many I/O options.</p>
<h3>Arc-flash detection (ordering option)</h3>
<ul><li>Fiber-optic light sensors: point sensors in compartments or a bare-fiber loop along the bus.</li>
<li>Light alone is not enough. A secure trip requires <b>light AND fast overcurrent</b> (arc-flash phase / neutral overcurrent elements).</li>
<li>The relay continuously self-tests the fiber; route the sensor-fail bit to an annunciator window.</li>
<li>Typical total clearing goal: a few milliseconds of relay time plus breaker time, which is why output contact type (fast hybrid outputs) matters.</li></ul>
<h3>Mirrored Bits</h3>
<p>Relay-to-relay protocol over serial or fiber. Each relay transmits <code>TMB1A…TMB8A</code> and receives the other’s as <code>RMB1A…RMB8A</code>. Channel health bits (e.g. <code>ROKA</code>) tell you if the link is good.</p>
<pre>Feeder 751:  TMB1A = 50P1                  ← "I see the fault"
Main 751:    SV05 = 50P1 AND NOT RMB1A     ← fault, but no feeder sees it → bus fault
             SV05PU = 3 cycles
             TR = SV05T OR 51PT</pre>
<p>This is a fast bus-trip (zone interlock) scheme. Always fail safe: decide what happens when the channel drops (<code>ROKA</code> = 0).</p>`,
quiz:[{q:'Why does arc-flash tripping need overcurrent supervision?',o:['To slow it down','To avoid trips from camera flashes or sunlight when a door opens','Light sensors are only alarms','It is not needed'],a:1,why:'Light + current is far more secure than light alone.'},
{q:'In the bus-blocking example, why AND NOT RMB1A?',o:['Feeder fault: let the feeder clear it','To test the channel','To reset the relay','To speed up reclosing'],a:0,why:'If a feeder sees the fault it is downstream, so the main must wait.'}]},

{id:'787a',phase:'Phase 3 · Relay profiles',title:'SEL-787: make the currents comparable',body:`
<p>A differential relay compares current in and current out. For a transformer you must correct for three things before they compare.</p>
<h3>1. Magnitude: TAP</h3><pre>TAPn = MVA × 1000 / (√3 × kVn × CTRn)      (A secondary, wye CTs)</pre>
<p>The relay divides each winding’s current by its TAP so rated load = 1.0 per unit on both sides. The max / min TAP ratio has a limit (check your manual).</p>
<h3>2. Phase shift: CT compensation</h3>
<p><code>W1CTC</code> and <code>W2CTC</code> (0–12) rotate each winding’s currents in 30° steps to cancel the transformer vector group (e.g. Dy1, Dyn11, YNd1). With wye-connected CTs, all compensation is done in the relay.</p>
<h3>3. Zero-sequence removal</h3>
<p>A grounded-wye winding passes zero-sequence current for external ground faults that the delta side never sees. A non-zero CTC matrix removes I0 so that fault looks external. A CTC of 0 does not remove I0, so use it only where no zero-sequence source exists.</p>
<h3>Prove it under load</h3>
<p><code>MET DIF</code> shows operate (IOP) and restraint (IRT) currents. With load flowing, IOP should be near zero. A large IOP usually means CT polarity, a phase swap, or the wrong CTC.</p>`,
labs:['tap'],
quiz:[{q:'20 MVA, 69 kV, CTR 60. TAP1?',o:['2.79 A','4.65 A','1.61 A','11.6 A'],a:0,why:'20000 / (1.732 × 69 × 60) = 2.79 A.'},
{q:'IOP is large under normal load. Most likely cause?',o:['Slope too low','CT polarity or compensation error','Harmonic block','Time dial'],a:1,why:'Through-load should cancel; leftover current means the inputs don’t match.'},
{q:'Why remove zero-sequence current on a grounded-wye winding?',o:['To speed up tripping','So external ground faults do not create false differential current','It improves metering','To block inrush'],a:1,why:'The delta side never sees that I0.'}]}
);
window.LESSONS.push(
{id:'787b',phase:'Phase 3 · Relay profiles',title:'SEL-787: slope and harmonics',body:`
<p>Once currents are compensated, the relay computes per phase:</p>
<pre>IOP = |I1 + I2|        operate current (with both measured into the zone)
IRT = restraint, built from |I1| and |I2|   (see your manual for the exact definition)</pre>
<h3>Dual-slope characteristic (87R)</h3>
<ul><li><code>O87P</code>: minimum operate current (e.g. 0.3 pu).</li>
<li><code>SLP1</code>: first slope, covers CT error and tap-changer mismatch (e.g. 25%).</li>
<li><code>IRS1</code>: restraint where slope 2 starts (e.g. 3 pu).</li>
<li><code>SLP2</code>: steeper slope for CT saturation on heavy through-faults (e.g. 50–70%).</li></ul>
<h3>Inrush and overexcitation</h3>
<div class="tbl"><table><tr><th>Condition</th><th>Signature</th><th>Setting</th></tr>
<tr><td>Energization inrush</td><td>High 2nd harmonic</td><td><code>PCT2</code> (e.g. 15%)</td></tr>
<tr><td>Inrush (modern low-loss cores)</td><td>4th harmonic, lower 2nd</td><td><code>PCT4</code></td></tr>
<tr><td>Overexcitation (V/Hz)</td><td>High 5th harmonic</td><td><code>PCT5</code></td></tr></table></div>
<p>Blocking can be per phase or cross-phase (common harmonic blocking). The 787 also offers harmonic restraint, which adds harmonic content to the restraint quantity instead of a hard block.</p>
<h3>87U unrestrained</h3><p><code>U87P</code> (e.g. 8–10 pu) trips for severe internal faults regardless of harmonics, because CT saturation can create harmonics during a real fault.</p>
<p class="note">Values above are common starting points from application literature. Your utility’s philosophy and the transformer’s data decide final settings.</p>`,
labs:['slope'],
quiz:[{q:'What does SLP2 protect against?',o:['Inrush','CT saturation on heavy external faults','Load unbalance','Overexcitation'],a:1,why:'Higher slope at high restraint tolerates saturation error.'},
{q:'Which harmonic indicates overexcitation?',o:['2nd','4th','5th','3rd'],a:2,why:'Overexcitation produces strong 5th harmonic.'},
{q:'Why keep 87U unblocked by harmonics?',o:['It is faster to set','Heavy internal faults can saturate CTs and create harmonics','It only sees ground faults','It replaces 87R'],a:1,why:'You must not block a real high-current internal fault.'}]},

{id:'io',phase:'Phase 4 · Panel integration',title:'The I/O point map',body:`
<p>The I/O map is the single document that ties schematics, relay settings and the annunciator together. Build it before writing logic.</p>
<div class="tbl"><table><tr><th>Relay</th><th>Point</th><th>Terminal</th><th>Wire #</th><th>Logic / bit</th><th>Destination</th><th>Dwg</th><th>Tested</th></tr>
<tr><td>351S-F1</td><td>OUT101</td><td>A01 / A02</td><td>F1-T1</td><td>TRIP</td><td>52-F1 TC1</td><td>E-301</td><td>☐</td></tr>
<tr><td>351S-F1</td><td>OUT103</td><td>A05 / A06</td><td>F1-A1</td><td>LT01</td><td>ANN W1 Feeder trip</td><td>E-310</td><td>☐</td></tr>
<tr><td>351S-F1</td><td>IN101</td><td>B01 / B02</td><td>F1-52A</td><td>52A</td><td>52-F1 aux a</td><td>E-302</td><td>☐</td></tr>
<tr><td>787-T1</td><td>OUT101</td><td>A01 / A02</td><td>T1-86</td><td>TRIP1</td><td>86T lockout</td><td>E-401</td><td>☐</td></tr>
<tr><td>787-T1</td><td>OUT103</td><td>A05 / A06</td><td>T1-A1</td><td>LT03</td><td>ANN W4 Xfmr diff</td><td>E-410</td><td>☐</td></tr>
<tr><td>All</td><td>IN102</td><td>B03 / B04</td><td>RST</td><td>reset</td><td>Panel alarm reset PB</td><td>E-310</td><td>☐</td></tr></table></div>
<p class="why">Terminals and drawing numbers above are invented for practice.</p>
<h3>Rules</h3><ul><li>One row per physical point, including spares.</li><li>Record contact type (a / b, standard / fast hybrid) and voltage rating; the trip output must be rated to break or be interrupted by the breaker’s 52a.</li>
<li>Include relay failure (alarm contact, normally closed on loss of power) to an annunciator window.</li><li>The “Tested” column becomes your commissioning record.</li></ul>`,
quiz:[{q:'Which relay output should go to an annunciator even if not in your logic?',o:['A spare','The relay self-test / alarm contact','The trip contact','None'],a:1,why:'A failed relay must be annunciated; its alarm contact usually opens or closes on failure.'},
{q:'Why build the I/O map before logic?',o:['It is faster to type','Logic references physical points; the map makes each traceable and testable','QuickSet requires it','To size cables'],a:1,why:'Every bit you assert must trace to a terminal and a window.'}]},

{id:'ann',phase:'Phase 4 · Panel integration',title:'Annunciator logic',body:`
<p>A local annunciator is a panel of lit windows, each driven by a contact. Decide who owns the sequence.</p>
<h3>Option A: the annunciator latches</h3><p>Most annunciators implement ISA-18.1 sequences: new alarm flashes, acknowledge makes it steady, reset clears it after the condition clears. The relay output simply follows the condition (or is pulsed). Simple, and operators get the standard flash / ack behaviour.</p>
<h3>Option B: the relay latches</h3><p>Use latch bits so a momentary trip holds the window lit through a DC loss, with a reset input from a panel pushbutton.</p>
<pre>351S:   SET01 = /TRIP
        RST01 = IN102 * !TRIP
        OUT103 = LT01
751/787: SET01 = R_TRIG TRIP
        RST01 = IN102 AND NOT TRIP
        OUT103 = LT01</pre>
<p class="note">Pick one per panel. If both latch, operators must reset twice and windows can disagree with the relay.</p>
<h3>Good window design</h3><ul><li>Trips (red) separate from alarms (amber).</li><li>First-out indication for lockout schemes so the initiating window is obvious.</li><li>Window text names the device and condition: “T1 87 DIFF TRIP”, not “TRIP 4”.</li><li>Use an SV timer to delay nuisance alarms (e.g. 10 s spring-charge).</li></ul>`,
labs:['selogic'],
quiz:[{q:'In ISA-18.1 sequences, what does acknowledge usually do?',o:['Clears the alarm','Stops flashing; window stays lit','Resets the relay','Silences only the horn and clears the window'],a:1,why:'Ack turns flashing to steady; reset clears after the condition returns to normal.'},
{q:'Main risk of latching in both the relay and the annunciator?',o:['Slower trips','Double resets and windows that disagree with the relay','CT saturation','None'],a:1,why:'Pick one owner of the latch.'}]}
);
window.LESSONS.push(
{id:'pu',phase:'Phase 5 · Testing',title:'Pickup, dropout and timing tests',body:`
<p>Secondary injection uses a relay test set (Omicron CMC, Doble F6150 or similar) to drive currents and voltages into the relay’s CT / PT inputs with the real CTs isolated at the test switches.</p>
<h3>Safety first</h3><ul><li>Open the test switch: CT circuits are shorted before the relay side is opened. Never open a live CT secondary.</li><li>Isolate trip outputs to live breakers unless the test plan includes a trip check.</li><li>Record as-found settings and the test plan before injecting.</li></ul>
<h3>Pickup and dropout</h3><ol><li>Isolate the element: disable or torque-control the others, or watch only its bit with <code>TAR</code>.</li>
<li>Ramp slowly up through the setting; record the value where the bit asserts.</li><li>Ramp down; record dropout (often about 95% of pickup).</li><li>Compare with the manual’s accuracy (commonly ±5% of setting plus a small fixed error).</li></ol>
<h3>Timing</h3><p>Apply a step at M = 2, 5 and 10 (plus a point near the instantaneous). Stop the timer on the trip contact, not on a bit. Compare with the calculated curve time and tolerance.</p>
<h3>Directional checks</h3><p>Apply fault voltage with current in the forward direction, then reverse the current angle 180°. The element should operate forward and block reverse.</p>`,
labs:['curve'],
quiz:[{q:'What must happen before the relay side of a CT circuit is opened?',o:['Nothing','The CT secondary is shorted by the test switch','The breaker is closed','The relay is powered off'],a:1,why:'An open CT secondary under load produces dangerous voltage.'},
{q:'Where should you stop the timer for a timing test?',o:['On 51P','On the trip output contact','On the event report','On the front LED'],a:1,why:'You are proving the whole path, including the output contact.'}]},

{id:'difft',phase:'Phase 5 · Testing',title:'Testing the 787 differential',body:`
<p>Differential testing needs currents on both windings with the correct magnitudes and angles.</p>
<h3>1. Balance test (through-load)</h3><p>Inject TAP1 on W1 and TAP2 on W2, with the angle shift the vector group and CTC require. <code>MET DIF</code> should show IOP ≈ 0. This proves TAP, CTC and your understanding of the connection.</p>
<h3>2. Minimum pickup</h3><p>Inject one winding only and ramp up. Single-winding, single-phase injection is affected by zero-sequence removal and the CTC matrix, so the current to trip may differ from O87P × TAP. Calculate the expected value first.</p>
<h3>3. Slope points</h3><p>Hold a restraint level, then raise the difference until trip. Repeat at points below and above IRS1. Plot results against the characteristic.</p>
<h3>4. Harmonic blocking</h3><p>Inject fundamental plus a 2nd harmonic component on one winding. Raise the harmonic until the trip blocks; it should be at PCT2. Repeat for 5th with PCT5.</p>
<h3>5. Unrestrained</h3><p>Inject above U87P with heavy 2nd harmonic. 87U must still trip.</p>`,
labs:['slope','tap'],
quiz:[{q:'What proves TAP and CTC are right before slope testing?',o:['A timing test','A balance test showing IOP ≈ 0','A harmonic test','Pulsing the output'],a:1,why:'Through-current that balances proves magnitude and angle compensation.'},
{q:'Why can single-phase, single-winding pickup differ from O87P × TAP?',o:['Firmware bug','CT compensation and zero-sequence removal change the per-phase operate current','Slope 2','Debounce'],a:1,why:'The compensation matrix distributes and removes current components.'}]},

{id:'verify',phase:'Phase 5 · Testing',title:'Trip checks and event analysis',body:`
<h3>Trip and annunciator verification</h3><ul><li>Operate each element (or use <code>PUL OUTnnn</code> for wiring checks) and confirm the contact changes state.</li>
<li>Confirm the breaker or breaker simulator trips and 52a / 52b status returns to the relay inputs.</li>
<li>Confirm the correct annunciator window lights, latches and resets as designed. Tick the I/O map.</li>
<li>Check the trip circuit from the relay all the way to the trip coil, including lockout relays (86).</li></ul>
<h3>Event reports</h3><p>Each trip creates an event. Pull it with QuickSet or the terminal (<code>HIS</code>, then <code>EVE n</code> or <code>CEV n</code>). QuickSet’s event viewer shows waveforms and digital channels; events can also be saved as COMTRADE for other tools.</p>
<ul><li>Analog: magnitudes and angles match what the test set injected.</li><li>Digital: element picks up, times out, TRIP asserts, output closes, 52A drops. Read the cycle-by-cycle sequence.</li>
<li>Timing: from fault inception to TRIP, then to breaker open.</li></ul>
<h3>SER</h3><p>The Sequential Events Recorder logs the bits you choose with timestamps. Add inputs, outputs, trips and latches so you can reconstruct any operation.</p>
<p class="note">Save test-set files and event files next to the as-left .rdb. The next person can repeat your test exactly.</p>`,
quiz:[{q:'Which command lists recent events?',o:['SER','HIS','MET','SHO'],a:1,why:'HIS shows event history; then pull EVE / CEV for detail.'},
{q:'In the event digital channels, what should follow TRIP asserting on a good trip?',o:['52A asserting','52A dropping out as the breaker opens','79 lockout always','Nothing'],a:1,why:'The breaker opens, so the 52a contact opens.'}]},

{id:'cap',phase:'Capstone',title:'Capstone project',body:`
<p>Do this end to end on a bench relay or offline in QuickSet plus a test set. When you can finish it without notes, you have the skill set this course targets.</p>
<h3>Scenario</h3><p>20 MVA, 69 / 12.47 kV, Dyn1 transformer. 787 on the transformer (CTs 300:5 high side, 1200:5 low side). Main breaker and two feeders on 351S / 751 relays. A 24-window local annunciator.</p>
<h3>Deliverables</h3><ol>
<li>I/O map for all three relays, including spares and relay-fail contacts.</li>
<li>787 settings: TAP, CTC, slope, harmonics, 87U, backup 51 per winding. Hand-check TAP.</li>
<li>Feeder settings: 50 / 51 / 51G coordinated with a 65T fuse and with the main; 3-shot reclosing with fuse saving.</li>
<li>Main 751: fast bus trip using Mirrored Bits from the feeders, with channel-fail fallback.</li>
<li>Annunciator logic with one latching owner and a reset pushbutton.</li>
<li>Test plan: pickup / dropout, timing at M = 2 / 5 / 10, 87 balance, slope and harmonic points, trip and window checks.</li>
<li>Event analysis of one injected fault per relay, explained cycle by cycle.</li></ol>
<p class="why">Hint: CTR1 = 60, CTR2 = 240. Use the TAP lab to start.</p>
<h3>Where to go next</h3><ul><li>SEL instruction manuals and application guides for each relay.</li><li>SEL University protection courses (instructor-led).</li><li>IEEE C37.91 (transformer protection guide) and C37.112 (inverse-time curves).</li><li>Shadow a commissioning crew; ask to read their test reports.</li></ul>`,
labs:['tap','slope','curve','selogic']}
);
window.XLESS0=[
{id:'ee1',phase:'Phase 0 · EE foundations',title:'Phasors: what the relay actually measures',body:`
<p>A relay never “sees” a wire. It samples CT and PT secondaries many times per cycle and filters each one down to a <b>phasor</b>: a magnitude and an angle at 60 Hz. Every protection element then does arithmetic on those phasors.</p>
<div data-v="sine"></div>
<h3>The three ideas you need</h3><ol>
<li><b>Phasor = rotating arrow frozen in time.</b> A sinusoid A·sin(ωt + θ) becomes A∠θ. Amplitude becomes length, timing offset becomes angle.</li>
<li><b>Angles are relative.</b> The relay uses VA (or IA) as the 0° reference. A current at −80° lags its voltage by 80°, which is typical of a fault on an inductive line. A current at −30° is typical of load at 0.87 power factor.</li>
<li><b>Phasors add as vectors.</b> Three balanced phases sum to zero. Any residual (IA + IB + IC ≠ 0) means current is returning through ground.</li></ol>
<h3>Why it matters for logic</h3><p>Every element bit (50P1, 51G, 32F, 87R…) is the output of a <b>comparison</b> on a phasor quantity: <code>|I| ≥ pickup</code>, <code>angle within a zone</code>, <code>IOP ≥ slope·IRT</code>. When an element misbehaves, find which phasor quantity it compares and check that quantity in <code>MET</code> first. The logic is almost never wrong when the input is wrong.</p>
<p class="note">Rule of thumb: <b>wrong angle = wiring problem, wrong magnitude = ratio problem.</b> A 180° error points to reversed polarity. A 120° error points to a phase-rotation swap.</p>`,
labs:['phasor'],
quiz:[{q:'IA = 5∠−30°, IB = 5∠−150°, IC = 5∠90°. What is IA + IB + IC?',o:['15 A','0 A','5 A','8.7 A'],a:1,why:'Balanced phasors 120° apart cancel, so there is no residual and no ground current.'},
{q:'On a load check, one phase current reads 180° from where it should be. Most likely cause?',o:['Wrong CT ratio','Reversed CT polarity on that phase','Wrong TAP','Bad firmware'],a:1,why:'Polarity reversal flips the phasor exactly 180°; magnitude stays right.'},
{q:'A fault current lags its voltage by about 80°. Why?',o:['The relay delays it','Line impedance is mostly inductive','CT saturation','The breaker is open'],a:1,why:'Transmission and distribution lines are mostly reactive, so fault current follows the line impedance angle.'}]},

{id:'ee2',phase:'Phase 0 · EE foundations',title:'Symmetrical components: the fault fingerprint',body:`
<p>Any three unbalanced phasors can be split into three balanced sets. This is the most powerful idea in protection, because each set maps to a family of elements.</p>
<div data-v="seq"></div>
<div class="tbl"><table><tr><th>Set</th><th>Formula (a = 1∠120°)</th><th>Appears in</th><th>Elements that use it</th></tr>
<tr><td><b>Positive I1</b></td><td>(IA + a·IB + a²·IC) / 3</td><td>Load and every fault</td><td>50P / 51P (via phase), 21 distance, 32P</td></tr>
<tr><td><b>Negative I2</b></td><td>(IA + a²·IB + a·IC) / 3</td><td>Any <i>unbalance</i>: L-L, L-G, open phase, wiring errors</td><td>50Q / 51Q, 46, 32Q, 47 (V2)</td></tr>
<tr><td><b>Zero I0</b></td><td>(IA + IB + IC) / 3</td><td>Only faults that involve ground</td><td>50G / 51G (IG = 3I0), 32G, 67G</td></tr></table></div>
<h3>Fingerprints to memorise</h3><ul>
<li><b>3-phase fault:</b> I1 only. Ground and negative-sequence elements stay quiet.</li>
<li><b>Phase-to-phase (B-C):</b> I1 and I2, equal in size. No I0.</li>
<li><b>Single line-to-ground (A-G):</b> I1 = I2 = I0, so all three appear.</li>
<li><b>Open phase or reversed CT:</b> large I2 at <i>load</i> current. This is why 46 / 50Q catches wiring mistakes during commissioning.</li></ul>
<h3>Second-order thinking</h3><p>Because each fault type has a fingerprint, you can write logic that <b>classifies</b> the fault. For example, “ground involved” = 50G, and “unbalanced without ground” = <code>50Q AND NOT 50G</code>. SEL’s faulted-phase selection, event targets (AG, BC…) and the 32 directional logic all work this way.</p>`,
labs:['phasor'],
quiz:[{q:'Which sequence quantity is zero for a 3-phase fault?',o:['I1 only','I2 and I0','I0 only','None'],a:1,why:'A symmetrical fault stays balanced: only positive sequence.'},
{q:'You see I2 ≈ I1 and I0 = 0. Fault type?',o:['A-G','B-C (phase-phase)','3-phase','Load'],a:1,why:'Phase-phase faults produce equal I1 and I2 with no ground path.'},
{q:'Why can 50Q detect a swapped CT wire during a load check when 50P cannot?',o:['50Q is faster','The swap creates negative sequence at load current, while magnitudes stay normal','50Q uses voltage','It cannot'],a:1,why:'A swap or reversal breaks the balance without raising magnitude, so I2 appears.'}]},

{id:'ee3',phase:'Phase 0 · EE foundations',title:'Per-unit, fault levels and CT polarity',body:`
<p>Before you set a pickup you need the fault current at the relay in <b>secondary amps</b>. Per-unit is the bookkeeping that gets you there.</p>
<h3>Per-unit in four lines</h3><pre>I_base = MVA_base · 1000 / (√3 · kV)        amps primary
Z_base = kV² / MVA_base                       ohms
I_fault = I_base / Z_total_pu                 (3-phase, bolted)
I_secondary = I_fault / CTR,   M = I_secondary / pickup</pre>
<p>Impedances in series add in pu (source + transformer + line), so fault current falls with distance. Your 51 must still see M ≥ ~1.5 at the far end of its zone; that is the <b>sensitivity</b> check. Your 50 must <b>not</b> reach through the next device; that is the <b>selectivity</b> check.</p>
<div data-v="ct"></div>
<h3>CT polarity</h3><p>Primary current entering the dot (H1) makes secondary current leave the dot (X1). SEL relays expect a defined polarity. Get it wrong and the directional elements (32) see every forward fault as reverse, and the 87 sees through-load as an internal fault. Both are logic failures that come from physics.</p>`,
labs:['pu','phasor'],
quiz:[{q:'20 MVA at 12.47 kV. I_base is about:',o:['926 A','1600 A','160 A','9260 A'],a:0,why:'20000 / (1.732 × 12.47) ≈ 926 A.'},
{q:'Total Z = 10% on that base. Bolted 3-phase fault current?',o:['92.6 A','926 A','9260 A','2000 A'],a:2,why:'926 / 0.10 = 9260 A.'},
{q:'With a reversed CT on one phase, what happens to a 787 at full load?',o:['Nothing','IOP ≈ 2 × load current on that phase; it may trip','It blocks','Only alarms'],a:1,why:'The phase stops cancelling and doubles instead.'}]}];

window.XLESS2=[
{id:'lg1',phase:'Phase 2 · SELogic',title:'Combinational vs sequential: logic with memory',body:`
<p>Everything so far was <b>combinational</b>: output = f(inputs right now). Real protection schemes are <b>sequential</b>: the output depends on the inputs <i>and on history</i>. That second-order layer is where most scheme design (and most bugs) lives.</p>
<div data-v="seqlogic"></div>
<h3>The four memory primitives in SEL</h3><div class="tbl"><table><tr><th>Primitive</th><th>SEL form</th><th>Remembers</th><th>Typical use</th></tr>
<tr><td>Timer</td><td><code>SVnn</code> + PU / DO → <code>SVnnT</code></td><td>How long a condition has been true or false</td><td>Delays, debounce, minimum pulse, breaker failure</td></tr>
<tr><td>Latch</td><td><code>SETnn</code> / <code>RSTnn</code> → <code>LTnn</code></td><td>That an event happened, until a reset</td><td>Targets, alarms, mode memory, lockout</td></tr>
<tr><td>Edge</td><td><code>R_TRIG</code> / <code>F_TRIG</code> (751/787), <code>/</code> <code>\\</code> (351S)</td><td>The previous scan’s value</td><td>One-shots, counting, “do this once”</td></tr>
<tr><td>Self-reference (seal-in)</td><td><code>SV01 = START OR (SV01 AND NOT STOP)</code></td><td>Its own last output</td><td>Hold-in circuits; prefer a latch</td></tr></table></div>
<h3>How the relay executes it</h3><p>Every processing interval (for example ¼ or ½ cycle, depending on model and settings) the relay evaluates every SELogic equation <b>once, top to bottom</b>. A bit used <i>before</i> the line that sets it carries last interval’s value. Order matters, and the simulator below models it exactly.</p>
<h3>Design method</h3><ol><li>Write the requirement as a timing diagram first. Draw what each output must do over time.</li><li>Pick the primitive that holds the memory you need.</li><li>Write the equation, then test it in the simulator against normal, short-pulse and bounce inputs.</li></ol>`,
labs:['sim'],
quiz:[{q:'A trip bit is true for 1 cycle. How do you guarantee the output contact closes at least 6 cycles?',o:['Pickup timer 6','Dropout timer 6','A latch with no reset','R_TRIG'],a:1,why:'A dropout timer holds its output after the input clears.'},
{q:'R_TRIG IN101 is true for how long when IN101 turns on and stays on?',o:['While IN101 is on','One processing interval','Until reset','Never'],a:1,why:'An edge compares this scan to the last, so it is true for one interval only.'},
{q:'SET01 and RST01 are both true. LT01 is:',o:['1','0 (reset dominant)','Toggles','Unchanged'],a:1,why:'SEL latches are reset-dominant.'}]},

{id:'lg2',phase:'Phase 2 · SELogic',title:'Designing schemes: permissives, interlocks, breaker failure',body:`
<p>A scheme is a few patterns combined. Learn the patterns and you can read or write any panel’s logic.</p>
<div data-v="bf"></div>
<h3>Pattern library</h3><div class="tbl"><table><tr><th>Pattern</th><th>Shape</th><th>Example</th></tr>
<tr><td>Supervision (permissive)</td><td>X AND P</td><td><code>67P1TC = 32PF</code>, <code>TR = 51PT AND 32PF</code></td></tr>
<tr><td>Blocking</td><td>X AND NOT B</td><td><code>CL = CC AND NOT 86LO AND NOT TRIP</code></td></tr>
<tr><td>Selector / mux</td><td>(S AND A) OR (NOT S AND B)</td><td>Local / remote close source</td></tr>
<tr><td>Voting</td><td>pairs ORed</td><td>2-of-3 sensors</td></tr>
<tr><td>Disagreement</td><td>XNOR / XOR</td><td>52A vs 52B status check</td></tr>
<tr><td>Fail-safe monitor</td><td>alarm on NOT healthy</td><td>Trip-coil monitor, DC-loss alarm</td></tr></table></div>
<h3>Worked scheme: breaker failure (50BF)</h3><pre>SET01 = TR                  # initiation remembered
RST01 = NOT 50FD            # forget once current is gone
SV02  = LT01 AND 50FD       # still initiated AND still current
SV02PU = 9 cycles           # longer than breaker time + margin
BFT   = SV02T               # trip the bus / 86BF</pre>
<p>The design reasoning: a breaker that opened leaves <b>no current</b>, so 50FD dropping is the proof of success. The timer must exceed breaker clearing time plus the reset time of 50FD, but stay short enough to protect equipment. Prove it in the simulator with a clearing breaker and a stuck one.</p>
<p class="note">Second-order check for any scheme: list each <b>input that can fail</b> (stuck at 0, stuck at 1, chatter) and say what the output does. If one stuck input can cause a trip, add supervision or voting.</p>`,
labs:['chal','sim'],
quiz:[{q:'Why does breaker failure reset on NOT 50FD rather than on 52A?',o:['52A is slower','Auxiliary contacts can lie; current is direct proof the arc is out','52A does not exist','Habit'],a:1,why:'A breaker can show open aux contacts while still conducting. Current detection is the reliable proof.'},
{q:'“Close only if not locked out and no trip.” Which pattern?',o:['Voting','Blocking (AND NOT)','Selector','Edge'],a:1,why:'Conditions that prevent an action enter as AND NOT.'},
{q:'In 351S syntax, 50P1 + 51PT * 32F means:',o:['(50P1 + 51PT) * 32F','50P1 + (51PT * 32F)','Error','Depends'],a:1,why:'AND binds tighter than OR, so parenthesise intent.'}]},

{id:'lg3',phase:'Phase 2 · SELogic',title:'State machines: reclosing and modes',body:`
<p>When logic has a few named situations and well-defined moves between them, model it as a <b>finite-state machine</b>: states, events and transitions. SEL’s 79 element is a built-in one. You will also build your own: remote/local modes, hot-line tag, transfer schemes.</p>
<h3>Reading the 79 as a machine</h3><ul>
<li><b>States:</b> Reset (79RS), Reclose cycle (79CY), Lockout (79LO).</li>
<li><b>Events:</b> trip, open-interval timer done, reset timer done, drive-to-lockout (79DTL), manual close.</li>
<li><b>Memory:</b> the shot counter SH0…SHn. It is what makes “trip #1” behave differently from “trip #3”.</li></ul>
<p>Fuse saving falls straight out of the shot counter: allow the fast curve only on SH0, as in <code>51P1TC = SH0</code> or <code>50P1TC = SH0</code>. The first trip clears temporary faults before the fuse melts, and later shots let the fuse coordinate.</p>
<h3>Building your own state machine with latches</h3><pre># Mode memory: LOCAL vs REMOTE from two momentary pushbuttons
SET05 = R_TRIG PB_LOCAL
RST05 = R_TRIG PB_REMOTE
LOCAL = LT05
REMOTE = NOT LT05</pre>
<p>One latch is a two-state machine. Two latches give four states; use them carefully and make every illegal state impossible by design.</p>`,
labs:['rec','sim'],
quiz:[{q:'What makes the second trip in a reclose cycle different from the first?',o:['Nothing','The shot counter state','The breaker','The CT'],a:1,why:'The shot counter is the machine’s memory.'},
{q:'Fuse saving uses which condition to enable the fast element?',o:['79LO','SH0','79CY','52A'],a:1,why:'Fast trip on the first shot only.'},
{q:'A latch-based mode has how many states?',o:['1','2','3','Unlimited'],a:1,why:'LTnn is 0 or 1.'}]},

{id:'lg4',phase:'Phase 2 · SELogic',title:'Debugging logic: races, order, fail-safety',body:`
<p>Most field problems are not wrong elements. They are <b>timing and order</b> mistakes in logic that looked right on paper.</p>
<div data-v="race"></div>
<h3>The five classic bugs</h3><ol>
<li><b>Precedence.</b> <code>A + B * C</code> is not <code>(A + B) * C</code>. Always parenthesise mixed AND / OR.</li>
<li><b>Order / one-scan lag.</b> A bit read above the line that writes it is one interval old. A chain of three such reads adds three intervals of delay. Put producers above consumers.</li>
<li><b>Self-holding without escape.</b> <code>SV01 = A OR SV01</code> can never drop. Every hold needs an AND NOT reset.</li>
<li><b>Edge on a chattering input.</b> R_TRIG on an unfiltered contact counts every bounce. Debounce first (input debounce settings or a PU timer), then take the edge.</li>
<li><b>Not fail-safe.</b> If an alarm is driven by a contact that closes on trouble, a cut wire hides trouble forever. Prefer “healthy = energized”, and alarm on its absence.</li></ol>
<h3>How to debug on a real relay</h3><ul><li><code>TAR</code> any bit to watch it live; <code>TAR R</code> to reset targets.</li><li>Add the suspect bits to <b>SER</b> and reproduce. The timestamps show order and lag to the millisecond.</li><li>Pull an <b>event report</b> with digital channels. Read it row by row against your timing diagram.</li></ul>`,
labs:['chal','sim'],
quiz:[{q:'SV01 = A OR SV01 — what is wrong?',o:['Nothing','It can never reset','Syntax error','It toggles'],a:1,why:'Once true, it holds itself forever.'},
{q:'Best way to see the exact order bits changed in a field operation?',o:['Front LEDs','SER with those bits added','MET','SHO'],a:1,why:'SER timestamps every state change of the chosen bits.'},
{q:'A fail-safe alarm input should be:',o:['Energized on trouble','Energized when healthy','Unused','Latched'],a:1,why:'Loss of wiring or DC then shows as an alarm.'}]}];

ins('351',[
{id:'dist',phase:P3,title:'Distance protection (21) on the 351S',body:`
<p>A distance element measures <b>impedance</b>: Z = V / I at the relay. A fault close to the relay gives a small Z; a fault far away gives a larger Z. Load gives a very large Z at an angle near 0–30°. Distance trips when the measured Z falls inside a zone.</p>
<h3>Mho characteristic</h3><p>A circle through the origin, its diameter along the line angle. Settings: <code>Z1MAG</code> (positive-sequence line impedance, Ω secondary), <code>Z1ANG</code> (line angle, typically 70–85°), then reach per zone: <code>Z1P</code>, <code>Z2P</code>, <code>Z3P</code> for phase mho, <code>Z1MG</code>, <code>Z2MG</code> for ground mho.</p>
<h3>Typical zone plan</h3><ul><li><b>Zone 1</b>: 80–85% of the line, no intentional delay. It must never overreach the remote bus, so it stops short of 100% to cover CT/PT/line-data error.</li><li><b>Zone 2</b>: 120–150% of the line, delay ~0.3–0.5 s (<code>Z2PD</code>, <code>Z2GD</code>). Covers the last 15–20% of the line and backs up the remote bus.</li><li><b>Zone 3</b>: remote backup or reverse-looking for schemes, longer delay.</li></ul>
<h3>Primary Ω to secondary</h3><p>Z<sub>sec</sub> = Z<sub>pri</sub> × CTR / PTR. Example: 10 Ω primary, CTR 240, PTR 1200 → 10 × 240/1200 = 2.0 Ω secondary.</p>
<h3>Ground distance needs k0</h3><p>A phase-to-ground fault loop includes the ground return. The relay compensates with k0 = (Z0 − Z1)/(3·Z1), set as <code>k0M1</code> / <code>k0A1</code>. Wrong k0 makes ground zones over- or under-reach.</p>
<h3>Trip logic</h3><p>Zone bits: <code>M1P</code>, <code>Z1G</code>; timed <code>M2PT</code>, <code>Z2GT</code>. Typical: <code>TR := M1P + Z1G + M2PT + Z2GT + 51GT</code>.</p>
<h3>Load encroachment</h3><p>Long zones can reach into heavy load. Load encroachment (<code>ELOAD=Y</code>, <code>ZLF</code>, <code>ZLR</code>, <code>PLAF</code>, <code>NLAF</code>) defines a wedge around the load region where phase distance is blocked. Bit <code>ZLOAD</code> asserts while measured Z is in that wedge.</p>
<h3>Loss of potential</h3><p>Distance needs voltage. If a PT fuse blows, V collapses and Z looks like zero: a false trip. <code>ELOP=Y</code> lets <code>LOP</code> block distance and directional elements; keep overcurrent backup unblocked.</p>`,labs:[],
quiz:[{q:'Line Z = 8 Ω primary, CTR 400, PTR 2000. Secondary?',o:['40 Ω','1.6 Ω','0.32 Ω','8 Ω'],a:1,why:'8 × 400/2000 = 1.6 Ω.'},
{q:'Why is Zone 1 set to about 80% and not 100%?',o:['Speed','So it never trips for faults beyond the remote bus','Load','Relay limit'],a:1,why:'Measurement error could make an external fault look internal.'},
{q:'PT fuse blows on a distance relay. What prevents a trip?',o:['k0','LOP blocking','Zone 2 delay','52A'],a:1,why:'Loss-of-potential detects the collapse and blocks voltage-based elements.'}]},
{id:'recl',phase:P3,title:'Reclosing (79) and breaker control',body:`
<p>Most overhead faults are temporary (lightning, contact). The 79 recloser re-closes the breaker after a trip so the line returns to service without a crew.</p>
<h3>Key settings on the 351S</h3><ul><li><code>E79</code> = number of shots (N, 1–4).</li><li><code>79OI1</code>…<code>79OI4</code>: open interval before each reclose (cycles). Shot 1 often fast (~30 cycles), later shots longer.</li><li><code>79RSD</code>: reset time from reclose cycle. Breaker must stay closed this long for the sequence to reset.</li><li><code>79RSLD</code>: reset time from lockout.</li></ul>
<h3>SELogic controls</h3><ul><li><code>79RI</code> reclose initiate (usually the TRIP rising edge).</li><li><code>79DTL</code> drive-to-lockout: conditions that must never reclose (breaker failure, bus fault, hot-line tag, trip after manual close).</li><li><code>79SKP</code> skip a shot. <code>79STL</code> stall the open-interval timer.</li><li><code>79CLS</code> supervision that must be true to issue the close (e.g. sync-check <code>25A1</code>, voltage present).</li></ul>
<h3>States</h3><p><code>79RS</code> reset, <code>79CY</code> in cycle, <code>79LO</code> lockout. Annunciate <code>79LO</code>. Operators clear lockout by closing the breaker manually.</p>
<h3>Close logic</h3><p><code>CL</code> is the close equation; <code>CLOSE</code> asserts, drives the close output and seals in until <code>52A</code> asserts or <code>CFD</code> (close-failure time) expires. Typical: <code>CL := SV03 * !LT01</code> (manual close not blocked by hot-line tag). Reclose closes come from the 79 automatically.</p>
<h3>Trip seal-in and unlatch</h3><p><code>TR</code> sets TRIP; TRIP stays for at least <code>TDURD</code> and until <code>ULTR</code> is true, typically <code>!(50L + 52A)</code>: current gone and breaker open.</p>
<h3>Antipumping</h3><p>If a close is held and the breaker trips onto a fault, it must not close again and again ("pumping"). Breakers have a 52Y relay; relay logic adds protection by closing only on a <i>rising edge</i> of the command.</p>
<h3>Trip-circuit monitoring</h3><p>Wire a contact input across the trip contact (through a resistor) so the input sees voltage while the circuit is healthy and the breaker is closed. Alarm if <code>52A * !IN105</code> for a few seconds: open trip coil or blown DC fuse.</p>`,labs:[],
quiz:[{q:'Which setting stops reclosing after a bus differential trip?',o:['79OI1','79DTL','79RSD','E79'],a:1,why:'Drive-to-lockout forces 79LO.'},
{q:'After shot 2 the breaker trips again with E79=2. State?',o:['79RS','79CY','79LO','79SKP'],a:2,why:'Shots used up: lockout.'},
{q:'What proves the trip coil is intact?',o:['CT','Contact input across the trip contact','PT','Front LED'],a:1,why:'Small current through the coil proves continuity.'}]}]);
ins('751',[
{id:'751b',phase:P3,title:'751: ground, negative-sequence, voltage and frequency',body:`
<h3>Ground overcurrent: three ways to measure</h3><ul><li><b>Residual (51G)</b>: the relay sums the three phase CTs = 3I0. Sensitivity limited by CT error; pickup rarely below ~10% of CT rating.</li><li><b>Neutral CT (51N)</b>: a CT on the transformer neutral. Good for resistance-grounded systems.</li><li><b>Core-balance CT</b>: one window CT around all three conductors. Very sensitive, used on high-resistance or ungrounded feeds.</li></ul>
<h3>Negative-sequence (46 / 50Q / 51Q)</h3><p>3I2 appears only for unbalance. Balanced load gives ~0, so 51Q pickup can sit below load current. It sees phase-to-phase faults that phase 51 is too slow for. To coordinate: for a phase-phase fault, 3I2 = √3 × I<sub>phase</sub>.</p>
<h3>Directional control (67)</h3><p>On networks or with DG, add direction. Negative- and zero-sequence directional elements (<code>32Q</code>, <code>32V</code>, <code>32I</code>) are chosen by <code>ORDER</code>. Torque-control a 51 with SELogic, e.g. <code>51P1TC := 32QF</code> (forward only).</p>
<h3>Voltage (27 / 59)</h3><ul><li><code>27P1P</code> undervoltage: load shedding, bus transfer, dead-bus detection.</li><li><code>59P1P</code> overvoltage; <code>59Q</code> negative-sequence overvoltage = phase loss; <code>59G</code> zero-sequence for ungrounded system ground detection.</li><li>Supervise 27 with breaker status or LOP so a blown PT fuse doesn't shed load.</li></ul>
<h3>Frequency (81)</h3><p><code>81D1P</code> etc. set as under (e.g. 59.3 Hz) or over frequency, with delays <code>81D1D</code>, supervised by undervoltage <code>27B81P</code> so they don't operate on a dead bus. Underfrequency load shedding uses steps: 59.3, 59.0, 58.7 Hz with ~6 cycle delays.</p>
<h3>Cold-load pickup</h3><p>After a long outage, inrush plus lost diversity can be 2–5× normal load for seconds. Options: switch to a settings group with higher pickup for a timed window after close, or block/raise 50 elements for a few seconds with a timer on <code>52A</code> rising.</p>`,labs:[],
quiz:[{q:'Why can 51Q pickup sit below load current?',o:['It is directional','Balanced load has almost no 3I2','It is slower','Load is resistive'],a:1,why:'Negative sequence is ~0 for balanced load.'},
{q:'Most sensitive ground detection on a high-resistance grounded feed?',o:['Residual 51G','Core-balance CT','51P','27'],a:1,why:'Window CT sees true zero sequence without phase CT error.'},
{q:'81 elements should be supervised by:',o:['50P','Undervoltage (27B81)','79','46'],a:1,why:'Frequency measurement is meaningless on a dead bus.'}]}]);
ins('787b',[
{id:'787c',phase:P3,title:'787: REF, overexcitation (24) and thermal (49)',body:`
<h3>Restricted earth fault (REF)</h3><p>A wye winding fault near the neutral produces little phase current, so 87T may miss it. REF compares the neutral CT current with residual 3I0 from the phase CTs of the same winding. External ground fault: they agree in direction. Internal: they don't. Check CT polarity: REF is directional, so a reversed neutral CT trips on every external ground fault.</p>
<h3>Overexcitation (24, V/Hz)</h3><p>Core flux ∝ V/f. High voltage or low frequency saturates the core and overheats it. Element measures V/Hz in % of nominal: alarm ~105%, inverse-time trip above ~110%, definite time ~118–120%. Overexcitation makes 5th harmonic, which is why 87T uses 5th-harmonic blocking.</p>
<h3>Thermal (49) and RTDs</h3><p>The 787 reads RTDs from an SEL-2600 module or internal card: winding, top oil, ambient. Set alarm and trip per the nameplate (e.g. top oil alarm 90 °C, trip 105 °C). Thermal bits can drive cooling fan stages through outputs.</p>
<h3>Through-fault monitoring</h3><p>Records the I²t of faults the transformer carries. Alarm when accumulated duty crosses a set value: a maintenance trigger.</p>
<h3>Sudden pressure / Buchholz</h3><p>Mechanical devices on the tank, wired to contact inputs. Route to trip in SELogic (<code>TR1 := 87R + 87U + REFF + IN104</code>) and to SER so you know which device operated. Transformer trips go through an 86 lockout: manual reset only.</p>`,labs:[],
quiz:[{q:'REF trips for every external ground fault. First suspect?',o:['Pickup too low','Neutral CT polarity','5th harmonic','RTD'],a:1,why:'REF is directional between neutral and residual current.'},
{q:'V/Hz rises when:',o:['Frequency rises','Voltage high or frequency low','Load rises','Ground fault'],a:1,why:'Flux ∝ V/f.'},
{q:'Transformer trips normally go through:',o:['79 recloser','86 lockout, manual reset','Self-reset only','PUL'],a:1,why:'Never re-energize a faulted transformer automatically.'}]}]);
})();
